<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Briefing</title>
<meta name="description" content="매일 아침 AI·반도체·경제·국내 산업·스타트업 뉴스를 모아 정리한 브리핑.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Morning Briefing">
<meta property="og:description" content="매일 아침 AI·반도체·경제·국내 산업·스타트업 뉴스를 모아 정리한 브리핑.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
</style>
<style>
  :root {
    --ground:   #EDEFF1;
    --surface:  #FFFFFF;
    --raise:    #F7F8F9;
    --ink:      #14181C;
    --ink-soft: #39424C;
    --muted:    #5D6773;
    --faint:    #8B95A0;
    --hair:     #D8DDE2;
    --hair-soft:#E6EAEE;
    --accent:   #9A6410;
    --accent-bg:#F2E7D4;
    --up:       #D6304A;
    --down:     #1F6FD0;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

    --rail: 132px;
    --gap:  32px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:   #0F1216;
      --surface:  #161A20;
      --raise:    #1C2129;
      --ink:      #E3E7EB;
      --ink-soft: #C0C7CF;
      --muted:    #8A94A0;
      --faint:    #6C7681;
      --hair:     #252B33;
      --hair-soft:#1F242B;
      --accent:   #DFA44C;
      --accent-bg:#2A2114;
      --up:       #FF6B7F;
      --down:     #5FA5F0;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0F1216;
    --surface:  #161A20;
    --raise:    #1C2129;
    --ink:      #E3E7EB;
    --ink-soft: #C0C7CF;
    --muted:    #8A94A0;
    --faint:    #6C7681;
    --hair:     #252B33;
    --hair-soft:#1F242B;
    --accent:   #DFA44C;
    --accent-bg:#2A2114;
    --up:       #FF6B7F;
    --down:     #5FA5F0;
  }

  :root[data-theme="light"] {
    --ground:   #EDEFF1;
    --surface:  #FFFFFF;
    --raise:    #F7F8F9;
    --ink:      #14181C;
    --ink-soft: #39424C;
    --muted:    #5D6773;
    --faint:    #8B95A0;
    --hair:     #D8DDE2;
    --hair-soft:#E6EAEE;
    --accent:   #9A6410;
    --accent-bg:#F2E7D4;
    --up:       #D6304A;
    --down:     #1F6FD0;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  a { color: inherit; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── masthead ────────────────────────────────── */
  .masthead {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 22px;
    border-bottom: 2px solid var(--ink);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .masthead h1 {
    font-size: clamp(34px, 5.4vw, 48px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    text-wrap: balance;
  }
  .masthead .topics {
    font-size: 16px;
    color: var(--muted);
  }

  /* ── stat strip ──────────────────────────────── */
  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 1px;
    background: var(--hair);
    border: 1px solid var(--hair);
    margin-top: 26px;
  }
  .stat {
    background: var(--surface);
    padding: 15px 17px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 23px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .stat-value .unit {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 3px;
  }
  .stat-delta {
    font-family: var(--mono);
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .stat-delta.up   { color: var(--up); }
  .stat-delta.down { color: var(--down); }

  /* ── 날짜 메뉴 ───────────────────────────────── */
  .datenav {
    display: flex;
    gap: 7px;
    margin-top: 26px;
    padding-bottom: 12px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    border-bottom: 1px solid var(--hair);
  }
  .datechip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    padding: 8px 15px;
    border: 1px solid var(--hair);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
    transition: background .13s, color .13s, border-color .13s;
  }
  .datechip:hover { border-color: var(--faint); }
  .datechip[aria-pressed="true"] {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .datechip .d {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .datechip .w {
    font-size: 12.5px;
    color: var(--faint);
    line-height: 1.3;
  }
  .datechip[aria-pressed="true"] .w { color: var(--accent); }
  .datechip.all {
    justify-content: center;
    padding-right: 18px;
    padding-left: 18px;
  }
  .datechip.all .d { font-family: var(--sans); font-size: 15px; }

  /* ── filters ─────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 18px 0 34px;
  }
  .chip {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    padding: 7px 16px;
    border: 1px solid var(--hair);
    border-radius: 100px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: background .13s, color .13s, border-color .13s;
  }
  .chip:hover { border-color: var(--faint); color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .chip .count {
    font-family: var(--mono);
    font-size: 12.5px;
    opacity: .65;
    margin-left: 5px;
  }

  /* ── timeline ────────────────────────────────── */
  .timeline { display: flex; flex-direction: column; }

  .day {
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    gap: var(--gap);
    padding: 34px 0;
    border-top: 1px solid var(--hair);
  }
  .day:first-child { border-top: none; padding-top: 6px; }

  .daymark {
    position: sticky;
    top: 20px;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .daymark .md {
    font-family: var(--mono);
    font-size: 29px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .daymark .yr {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--faint);
    letter-spacing: 0.06em;
  }
  .daymark .wd { font-size: 15px; color: var(--muted); }
  .badge-today {
    align-self: flex-start;
    margin-top: 5px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
  }

  .daybody { display: flex; flex-direction: column; gap: 26px; min-width: 0; }

  /* 한눈에 보기 */
  .digest {
    background: var(--surface);
    border: 1px solid var(--hair);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .digest h3 {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .digest ul { display: flex; flex-direction: column; gap: 11px; }
  .digest li {
    list-style: none;
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 4px;
    font-size: 17px;
    line-height: 1.62;
    color: var(--ink-soft);
  }
  .digest li::before {
    content: "";
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
  }
  .digest li:nth-child(1)::before { content: "01"; }
  .digest li:nth-child(2)::before { content: "02"; }
  .digest li:nth-child(3)::before { content: "03"; }
  .digest li:nth-child(4)::before { content: "04"; }
  .digest li:nth-child(5)::before { content: "05"; }
  .digest strong { font-weight: 700; color: var(--ink); }

  /* 그래서 뭐? — 사실이 아니라 판단. 시각적으로 확실히 구분한다 */
  .insight {
    background: var(--accent-bg);
    border: 1px solid var(--hair);
    border-left: 3px solid var(--accent);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .insight-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .insight-head h3 {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .insight-head .caveat {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0;
    text-transform: none;
    font-family: var(--sans);
  }
  .insight dl { display: flex; flex-direction: column; gap: 10px; }
  .insight dt {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .insight dd {
    font-size: 16.5px;
    line-height: 1.66;
    color: var(--ink-soft);
    max-width: 64ch;
  }
  .insight strong { font-weight: 700; color: var(--ink); }

  /* 진행 중인 흐름 배지 */
  .arc {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--hair-soft);
    padding: 2px 8px;
    border-radius: 2px;
  }
  .arc::before { content: "↳ "; color: var(--faint); }
  .brief .arc { flex: 0 0 auto; font-size: 11px; padding: 1px 6px; }

  /* 주제 섹션 */
  .topic { display: flex; flex-direction: column; gap: 14px; }
  .topic-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--hair);
  }
  .topic-head h3 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .topic-head .n {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .item { display: flex; flex-direction: column; gap: 6px; }
  .item h4 {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.44;
    letter-spacing: -0.014em;
    text-wrap: pretty;
  }
  .item p {
    font-size: 17px;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 62ch;
  }
  .sources { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 2px; }
  .src {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--hair);
    padding-bottom: 1px;
    transition: color .13s, border-color .13s;
  }
  .src::before { content: "→ "; color: var(--faint); }
  .src:hover { color: var(--accent); border-color: var(--accent); }

  /* 그 외 — 한 줄 항목 */
  .briefs-head {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-top: 6px;
  }
  .briefs {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--hair-soft);
  }
  .brief {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--hair-soft);
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .brief > span { flex: 1 1 22ch; min-width: 0; }
  .brief .src { flex: 0 0 auto; border-bottom: none; }

  .note {
    border-left: 2px dashed var(--hair);
    padding: 2px 0 2px 16px;
    font-size: 16px;
    line-height: 1.66;
    color: var(--muted);
    max-width: 62ch;
  }
  .note b {
    display: block;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .note ul { margin-top: 5px; padding-left: 16px; }
  .note li { margin-bottom: 4px; }

  .daymeta {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--faint);
    line-height: 1.6;
    padding-top: 4px;
    border-top: 1px solid var(--hair-soft);
  }

  .empty {
    font-size: 15.5px;
    color: var(--faint);
    padding: 40px 0;
    text-align: center;
    font-family: var(--mono);
  }

  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--hair);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--faint);
    line-height: 1.7;
  }
  footer .byline {
    display: block;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 6px;
  }

  /* ── mobile ──────────────────────────────────── */
  @media (max-width: 720px) {
    .page { padding: 28px 18px 60px; }
    .day {
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 26px 0;
    }
    .daymark {
      position: static;
      flex-direction: row;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ink);
    }
    .daymark .md { font-size: 25px; }
    .badge-today { margin-top: 0; }
    .item p, .note { max-width: none; }
    .item h4 { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
<style>
  .themetoggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--hair);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 7px 11px;
    border-radius: 2px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity .15s, color .15s, border-color .15s;
  }
  .themetoggle:hover { opacity: 1; color: var(--accent); border-color: var(--accent); }
  @media print { .themetoggle { display: none; } }
</style>
</head>
<body>
<button class="themetoggle" id="themetoggle" type="button">DARK</button>


<div class="page">

  <header class="masthead">
    <div class="eyebrow">Daily Brief</div>
    <h1>뉴스 브리핑</h1>
    <div class="topics">AI · 테크 / 반도체 · 하드웨어 / 경제 · 시장 / 국내 산업 · 정책 / 스타트업 · 투자</div>
  </header>

  <div class="strip" id="strip"></div>

  <nav class="datenav" id="dates" aria-label="날짜 선택"></nav>

  <nav class="filters" id="filters" aria-label="주제 필터"></nav>

  <main class="timeline" id="timeline"></main>

  <footer id="foot"></footer>

</div>

<script>
/* ══════════════════════════════════════════════════════════
   BRIEFINGS — /brief 실행 시 이 배열에 최신 날짜가 앞에 추가됩니다.
   ══════════════════════════════════════════════════════════ */

const BRIEFINGS = [
  {
    date: "2026-09-01",
    weekday: "화",
    isToday: true,
    collectedAt: "2026-09-01 06:20 KST",
    window: "최근 24시간 · 스타트업은 7일",
    tally: "검색 약 65건 · 총 14건 — AI 2 / 반도체 2 / 경제 4 / 국내산업 5 / 스타트업 1 (이른 아침 시간대 + 검색 결과 날짜 오인용 다수를 교차 확인 끝에 제외, 35건 목표 크게 미달)",
    metrics: [
      { label: "KOSPI",      value: "6,820.02", delta: "+0.46%",  dir: "up",   note: "8/31 종가" },
      { label: "KOSDAQ",     value: "834.29",   delta: "-0.49%",  dir: "down", note: "8/31 종가" },
      { label: "원/달러",     value: "1,368.6",  delta: "-3.9원",  dir: "down", note: "8/31 15:30 기준, 13개월래 최저" },
      { label: "다우존스",    value: "53,185.90", delta: "-0.70%", dir: "down", note: "8/31(현지시간) 종가" },
      { label: "WTI",        value: "$85.76",   delta: "+2.83%",  dir: "up",   note: "8/31(현지시간) 종가" }
    ],
    digest: [
      "미국이 8/30(현지시간) 호르무즈 해협의 이란 로켓 발사대를 한 달 만에 다시 공격하며 유가가 급등했고, 뉴욕증시 3대 지수는 8/31 일제히 하락 마감했다(다우 -0.70%, WTI +2.83%로 배럴당 85달러 돌파).",
      "<strong>삼성전자·SK하이닉스가 8/31 자사주 대량 매입(각 200만주·65만주)을 공시</strong>하며 코스피 6820선을 지켰다. 삼성전자 자사주 환원 규모는 여전히 미확정이다.",
      "현대차 노사 임단협 조합원 찬반투표가 8/31 실시됐지만 이 브리핑 작성 시점까지 결과가 확인되지 않았다. 2026년 세제개편안은 9월1일(오늘) 국무회의 상정이 예정돼 있다."

/* ══════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const ALL = "전체";

let activeTopic = ALL;
/* 기본값은 최신 브리핑. 지난 날짜는 날짜 메뉴에서 고른다. */
let activeDate = BRIEFINGS.length ? BRIEFINGS[0].date : ALL;

/* 데이터의 isToday는 루틴이 써넣는 값이라, 루틴이 하루 거르면 어제 것이 '오늘'로 남는다.
   그래서 표시용 라벨은 실제 날짜(KST)에서 직접 구한다. */
function kstToday() {
  try {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
  } catch (e) {
    return "";
  }
}
function shiftDate(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
}
const TODAY = kstToday();
const YESTERDAY = TODAY ? shiftDate(TODAY, -1) : "";

function dayLabel(b) {
  if (b.date === TODAY) return "오늘";
  if (b.date === YESTERDAY) return "어제";
  return b.weekday + "요일";
}

function allTopics() {
  const seen = [];
  BRIEFINGS.forEach((b) => b.sections.forEach((s) => {
    if (!seen.includes(s.topic)) seen.push(s.topic);
  }));
  return seen;
}

function sectionCount(s) {
  return (s.items ? s.items.length : 0) + (s.briefs ? s.briefs.length : 0);
}

/* 날짜·주제를 각각 ALL로 열어둘 수 있어서, 두 메뉴의 건수를 같은 함수로 센다. */
function countFor(date, topic) {
  let n = 0;
  BRIEFINGS.forEach((b) => {
    if (date !== ALL && b.date !== date) return;
    b.sections.forEach((s) => {
      if (topic === ALL || s.topic === topic) n += sectionCount(s);
    });
  });
  return n;
}

function selectedDay() {
  return activeDate === ALL ? null : BRIEFINGS.find((b) => b.date === activeDate);
}

function renderStrip() {
  const day = selectedDay();
  const shown = day || BRIEFINGS[0];
  const cells = [
    {
      label: day ? "보는 중" : "최신 브리핑",
      value: shown ? shown.date.slice(5).replace("-", ".") : "—",
      delta: shown ? dayLabel(shown) : ""
    },
    { label: "누적 일수", value: String(BRIEFINGS.length), unit: "일", delta: "" },
    { label: day ? "이 날 항목" : "누적 항목", value: String(countFor(activeDate, ALL)), unit: "건", delta: "" }
  ];
  /* 지표는 그 날짜의 것을 보여준다. 지난 날짜를 보면서 오늘 시세를 띄우면 안 된다. */
  if (shown && shown.metrics) cells.push(...shown.metrics);

  $("strip").innerHTML = cells.map((c) => `
    <div class="stat">
      <span class="stat-label">${esc(c.label)}</span>
      <span class="stat-value">${esc(c.value)}${c.unit ? `<span class="unit">${esc(c.unit)}</span>` : ""}</span>
      <span class="stat-delta ${c.dir === "up" ? "up" : c.dir === "down" ? "down" : ""}">${esc(c.delta || c.note || "")}</span>
    </div>`).join("");
}

function renderDates() {
  const chips = [`
    <button class="datechip all" type="button" data-date="${ALL}" aria-pressed="${activeDate === ALL}">
      <span class="d">전체</span>
      <span class="w">${BRIEFINGS.length}일 · ${countFor(ALL, activeTopic)}건</span>
    </button>`];

  BRIEFINGS.forEach((b) => {
    const [, m, d] = b.date.split("-");
    chips.push(`
      <button class="datechip" type="button" data-date="${esc(b.date)}" aria-pressed="${activeDate === b.date}">
        <span class="d">${m}.${d}</span>
        <span class="w">${esc(dayLabel(b).replace("요일", ""))} · ${countFor(b.date, activeTopic)}건</span>
      </button>`);
  });

  $("dates").innerHTML = chips.join("");
  $("dates").querySelectorAll(".datechip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeDate = btn.dataset.date;
      render();
    });
  });
}

function renderFilters() {
  const topics = [ALL, ...allTopics()];
  $("filters").innerHTML = topics.map((t) => `
    <button class="chip" type="button" data-topic="${esc(t)}" aria-pressed="${t === activeTopic}">
      ${esc(t)}<span class="count">${countFor(activeDate, t)}</span>
    </button>`).join("");

  $("filters").querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTopic = btn.dataset.topic;
      render();
    });
  });
}

function renderNote(note) {
  if (!note) return "";
  const body = note.items.length === 1
    ? `<div>${note.items[0]}</div>`
    : `<ul>${note.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
  return `<div class="note"><b>${esc(note.title)}</b>${body}</div>`;
}

function renderSources(sources) {
  return (sources || []).map((s) =>
    `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("");
}

function renderArc(arc) {
  return arc ? `<span class="arc">${esc(arc)}</span>` : "";
}

function renderItem(item) {
  return `
    <article class="item">
      <h4>${esc(item.title)}</h4>
      ${renderArc(item.arc)}
      <p>${esc(item.body)}</p>
      <div class="sources">${renderSources(item.sources)}</div>
    </article>`;
}

function renderBriefs(briefs) {
  if (!briefs || !briefs.length) return "";
  return `
    <div class="briefs-head">그 외 ${briefs.length}건</div>
    <div class="briefs">
      ${briefs.map((b) => `
        <div class="brief">
          <span>${esc(b.title)}</span>
          ${renderArc(b.arc)}
          ${renderSources(b.sources)}
        </div>`).join("")}
    </div>`;
}

function renderInsight(insight) {
  if (!insight || !insight.length) return "";
  const rows = insight
    .filter((x) => x && x.text)
    .map((x) => `<div><dt>${esc(x.label)}</dt><dd>${x.text}</dd></div>`)
    .join("");
  if (!rows) return "";
  return `
    <div class="insight">
      <div class="insight-head">
        <h3>그래서 뭐?</h3>
        <span class="caveat">사실이 아니라 판단입니다. 위 항목만 재료로 씁니다</span>
      </div>
      <dl>${rows}</dl>
    </div>`;
}

function renderTimeline() {
  const days = BRIEFINGS.filter((b) => activeDate === ALL || b.date === activeDate).map((b) => {
    const sections = b.sections.filter((s) => activeTopic === ALL || s.topic === activeTopic);
    if (!sections.length) return "";

    const [y, m, d] = b.date.split("-");
    const showDigest = activeTopic === ALL && b.digest && b.digest.length;
    const showInsight = activeTopic === ALL;

    return `
      <section class="day">
        <div class="daymark">
          <span class="md">${m}.${d}</span>
          <span class="yr">${y}</span>
          <span class="wd">${esc(b.weekday)}요일</span>
          ${b.date === TODAY ? '<span class="badge-today">오늘</span>' : ""}
        </div>
        <div class="daybody">
          ${showDigest ? `
            <div class="digest">
              <h3>한눈에 보기</h3>
              <ul>${b.digest.map((t) => `<li><span>${t}</span></li>`).join("")}</ul>
            </div>` : ""}
          ${showInsight ? renderInsight(b.insight) : ""}
          ${sections.map((s) => `
            <div class="topic">
              <div class="topic-head">
                <h3>${esc(s.topic)}</h3>
                <span class="n">${sectionCount(s)}건</span>
              </div>
              ${(s.items || []).map(renderItem).join("")}
              ${renderBriefs(s.briefs)}
              ${renderNote(s.note)}
            </div>`).join("")}
          <div class="daymeta">
            수집 ${esc(b.collectedAt)} · ${esc(b.window)}${b.tally ? " · " + esc(b.tally) : ""}
          </div>
        </div>
      </section>`;
  }).join("");

  const none = activeDate === ALL
    ? "해당 주제의 브리핑이 없습니다"
    : `${activeDate}에는 '${activeTopic}' 항목이 없습니다`;
  $("timeline").innerHTML = days || `<div class="empty">${esc(none)}</div>`;
}

function renderFoot() {
  const oldest = BRIEFINGS[BRIEFINGS.length - 1];
  const latest = BRIEFINGS[0];
  const range = BRIEFINGS.length > 1 ? `${oldest.date} — ${latest.date}` : latest ? latest.date : "";
  $("foot").innerHTML =
    `<span class="byline">Artifact by DK</span>` +
    `News Brief · ${esc(range)} · ${BRIEFINGS.length}개 브리핑<br>` +
    `<code>/brief</code> 실행 시 갱신됩니다. 모든 항목은 원문 출처 링크를 답니다.`;
}

function render() {
  renderStrip();
  renderDates();
  renderFilters();
  renderTimeline();
}

render();
renderFoot();
</script>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("themetoggle");
  if (!btn) return;

  // 저장된 선택이 없으면 data-theme을 비워 두고 prefers-color-scheme에 맡긴다.
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);

  function current() {
    var t = root.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function paint() {
    btn.textContent = current() === "dark" ? "LIGHT" : "DARK";
    btn.setAttribute("aria-label", "테마 전환");
  }

  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paint();
  });

  paint();
})();
</script>
</body>
</html>
