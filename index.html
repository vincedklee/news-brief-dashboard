<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Signal</title>
<meta name="description" content="글로벌 뉴스의 달라진 사실과 흐름별 근거를 비교하고, 관심 흐름의 새 진전과 다음 확인 일정을 살피는 브리핑.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Daily Signal">
<meta property="og:description" content="글로벌 뉴스의 달라진 사실과 흐름별 근거를 비교하고, 관심 흐름의 새 진전과 다음 확인 일정을 살피는 브리핑.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
</style>
<!-- 본문용 세리프. CSP가 허용하는 폰트 호스트는 구글 폰트뿐이다.
     가변 폰트 한 벌(400..700)로 받는다 — 정적 네 벌보다 가볍다.
     못 받아와도 아래 --serif의 시스템 세리프로 떨어진다. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400..700&family=UnifrakturCook:wght@700&display=swap">

<style>
  /* ══ 토큰 ══════════════════════════════════════
     색은 여기서만 정의한다. 컴포넌트는 토큰을 통해서만 색을 참조한다.

     뉴트럴은 **녹색 쪽으로 치우친 회색**, 액센트는 브론즈, 판단 층 배경은
     아이보리다. 셋이 같은 따뜻한 계열에 있어야 서로 붙는다 — 예전에는 뉴트럴이
     파랑 쪽이라(본문 글자색이 짙은 슬레이트블루) 아이보리와 부딪혔다.

     액센트가 따뜻한 쪽에 있는 이유는 시세 등락색(상승 빨강 --up / 하락 파랑 --down,
     한국 관행)과 겹치지 않기 위해서다. --up/--down 자체는 관행이라 건드리지 않는다. */
  :root {
    --ground:   #F3F4EC;
    --surface:  #FBFCFA;
    --raise:    #F1F4F0;
    --ink:      #131A16;
    --ink-soft: #35403A;
    --muted:    #5C665F;
    --faint:    #7E8880;
    --hair:     #D7DCD5;
    --hair-soft:#E8EBE6;
    --accent:   #8A5E14;
    --accent-bg:#F0E9D8;
    --up:       #C42A44;
    --down:     #1A5F9E;

    /* 본문 세리프. 신문처럼 읽히게 하는 것이 목적이다.
       기사에 해당하는 것은 전부 세리프, 네비게이션·라벨·숫자는 산스/모노 —
       신문에서 기사와 '가구'를 가르는 방식과 같다. */
    --masthead: "UnifrakturCook", "Old English Text MT", Georgia, serif;
    --serif: "Noto Serif KR", AppleMyungjo, "Nanum Myeongjo", Batang, 바탕,
             "Times New Roman", serif;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --rail: 116px;
    --gap:  30px;
  }

  /* 뷰어의 테마는 세 상태다 — 명시적 dark, 명시적 light, 그리고 아무것도
     찍히지 않은 기본(system). 기본 상태는 prefers-color-scheme만으로 갈리므로
     :root에 라이트 전체를 두고, 아래 두 블록에서 토큰만 다시 정의한다. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #0E120F;
      --surface:  #151A16;
      --raise:    #1B211C;
      --ink:      #E5E9E4;
      --ink-soft: #BEC6BF;
      --muted:    #8C958D;
      --faint:    #737C75;
      --hair:     #262D27;
      --hair-soft:#1D231E;
      --accent:   #DCA95E;
      --accent-bg:#241E11;
      --up:       #FF7286;
      --down:     #6FAEDF;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0E120F;
    --surface:  #151A16;
    --raise:    #1B211C;
    --ink:      #E5E9E4;
    --ink-soft: #BEC6BF;
    --muted:    #8C958D;
    --faint:    #737C75;
    --hair:     #262D27;
    --hair-soft:#1D231E;
    --accent:   #DCA95E;
    --accent-bg:#241E11;
    --up:       #FF7286;
    --down:     #6FAEDF;
  }

  :root[data-theme="light"] {
    --ground:   #F3F4EC;
    --surface:  #FBFCFA;
    --raise:    #F1F4F0;
    --ink:      #131A16;
    --ink-soft: #35403A;
    --muted:    #5C665F;
    --faint:    #7E8880;
    --hair:     #D7DCD5;
    --hair-soft:#E8EBE6;
    --accent:   #8A5E14;
    --accent-bg:#F0E9D8;
    --up:       #C42A44;
    --down:     #1A5F9E;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 52px 26px 90px;
  }

  a { color: inherit; }
  :focus-visible {
    outline: 1.5px solid var(--accent);
    outline-offset: 3px;
    border-radius: 1px;
  }

  /* 신문에서 기사와 '가구'를 가르듯, 네비게이션·캡션은 산스로 되돌린다 */
  .masthead .topics, .chip, .datechip, .insight-head .caveat, .arcs-caveat {
    font-family: var(--sans);
  }

  /* 라벨·수치는 모노 — 숫자가 세로로 맞아야 하는 곳 전부 */
  .stat-label, .mkt-head h2, .mkt-head .asof, .mkt-row .n, .mkt-row .d,
  .arcs > summary h2, .arcs > summary .tally, .arc-nums, .arc-detail dt,
  .arc-detail ol li span, .datechip .d, .datechip .w, .chip .count,
  .daymark .yr, .badge-today, .digest h3, .insight-head h3, .insight dt,
  .topic-head .n, .briefs-head, .src, .note b, .daymeta, .empty, footer,
  .spark-foot, .wk-head .range, .wk-block > h3, .wk-moved .p,
  .wk-metrics .l, .wk-metrics .v, .wk-metrics .d, .wk-watch h4, .arc {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  /* ══ 머리 ══════════════════════════════════════ */
  .masthead {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--ink);
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 5.2vw, 54px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.12;
    text-wrap: balance;
  }
  .masthead .topics {
    font-size: 14.5px;
    color: var(--muted);
    letter-spacing: 0.005em;
  }

  /* ══ 지표 스트립 ═══════════════════════════════
     카드가 아니라 발행물의 데이터 밴드다. 배경·바깥 테두리를 두지 않고
     위아래 가는 선과 세로 구분선만 쓴다. */
  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    margin-top: 30px;
  }
  .stat {
    padding: 16px 18px 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .stat + .stat {
    border-left: 1px solid var(--hair-soft);
    padding-left: 18px;
  }
  .stat-label {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .unit {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--faint);
    margin-left: 3px;
  }
  .stat-delta {
    font-family: var(--mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .stat-delta.up   { color: var(--up); }
  .stat-delta.down { color: var(--down); }

  /* ══ 시장 패널 (환율·유가) ══════════════════════
     여기만 카드다. 나머지 영역은 선과 여백으로 나눈다.
     추이 선은 시세 지표라 등락색을 쓴다 — 액센트는 맥락 표시용이라 여기 안 쓴다. */
  .markets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .mkt {
    border: 1px solid var(--hair);
    background: var(--surface);
    padding: 17px 19px 18px;
    min-width: 0;
  }
  .mkt[hidden] { display: none; }
  .mkt-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 15px;
  }
  .mkt-head h2 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .mkt-head .asof {
    font-size: 11.5px;
    color: var(--faint);
    text-align: right;
    min-width: 0;
  }
  .mkt-main .stat-label { font-size: 10.5px; }
  .mkt-main .big {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 3px 11px;
    margin-top: 4px;
  }
  .mkt-main .big b {
    font-family: var(--mono);
    font-size: 31px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.035em;
    line-height: 1.1;
  }
  .mkt-main .big .d {
    font-family: var(--mono);
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .mkt-main .big .d.up   { color: var(--up); }
  .mkt-main .big .d.down { color: var(--down); }
  .mkt-note {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    margin-top: 5px;
  }

  /* 스파크라인 — 저장된 브리핑에서 만든다. 외부 시세를 부르지 않는다 (CSP).
     가로축은 회차 순번이 아니라 날짜 간격이다 — 값이 빠진 날의 간격이 보여야 한다. */
  .spark { margin-top: 15px; max-width: 440px; }
  .spark svg { width: 100%; height: 54px; display: block; }
  .spark.up   { color: var(--up); }
  .spark.down { color: var(--down); }
  .spark.flat { color: var(--faint); }
  .spark .line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .spark .area { fill: currentColor; stroke: none; opacity: 0.07; }
  .spark .mark {
    stroke: currentColor;
    stroke-width: 1;
    stroke-dasharray: 1.5 3;
    opacity: 0.5;
    vector-effect: non-scaling-stroke;
  }
  .spark-foot {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--faint);
    margin-top: 7px;
  }

  .mkt-rows { margin-top: 16px; border-top: 1px solid var(--hair-soft); }
  .mkt-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hair-soft);
  }
  .mkt-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .mkt-row .n {
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .mkt-row .v {
    font-family: var(--mono);
    font-size: 15.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .mkt-row .d {
    font-size: 11.5px;
    color: var(--faint);
    min-width: 4.8em;
    text-align: right;
  }
  .mkt-row .d.up   { color: var(--up); }
  .mkt-row .d.down { color: var(--down); }
  .mkt-empty { color: var(--muted); font-size: 15px; }

  /* ══ 흐름 온도계 ═══════════════════════════════
     카드가 아니라 목록이다 — 테두리 없이 가는 선 하나로 구분한다.
     추적 대장의 타임라인 날짜를 센 **집계**지 판단이 아니다. 그래서 판단 층
     (.insight)의 액센트 배경을 쓰지 않고, 온도는 액센트 농도로만 낸다.
     등락색(--up/--down)은 시세 전용이라 여기 안 쓴다. */
  .arcs {
    margin-top: 34px;
    border-top: 1px solid var(--hair);
  }
  .arcs[hidden] { display: none; }
  .arcs > summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 15px 0 13px;
    cursor: pointer;
    list-style: none;
  }
  .arcs > summary::-webkit-details-marker { display: none; }
  .arcs > summary h2 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .arcs > summary .tally {
    font-size: 11.5px;
    color: var(--faint);
    margin-left: auto;
    text-align: right;
  }
  .arcs > summary::after {
    content: "펼치기";
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--faint);
    border-bottom: 1px solid var(--hair);
    padding-bottom: 1px;
    flex: 0 0 auto;
    margin-left: 4px;
  }
  .arcs[open] > summary::after { content: "접기"; }
  .arcs > summary:hover h2,
  .arcs > summary:hover::after { color: var(--accent); }
  .arcs > summary:hover::after { border-bottom-color: var(--accent); }

  .arcs-caveat {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    padding-bottom: 14px;
  }
  .arcs-caveat b { color: var(--ink-soft); font-weight: 600; }

  .arc-row { border-top: 1px solid var(--hair-soft); }
  .arc-row > summary {
    display: grid;
    grid-template-columns: 54px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
    cursor: pointer;
    list-style: none;
  }
  .arc-row > summary::-webkit-details-marker { display: none; }
  .arc-row > summary:hover .arc-name { color: var(--accent); }

  /* 최근 7일 진전 수. 색이 아니라 농도로 온도를 낸다 */
  .arc-meter { display: flex; gap: 3px; }
  .arc-meter i {
    flex: 1 1 0;
    height: 6px;
    background: var(--hair-soft);
  }
  .arc-row.hot     .arc-meter i.on { background: var(--accent); }
  .arc-row.warm    .arc-meter i.on { background: var(--accent); opacity: 0.5; }
  .arc-row.cooling .arc-meter i.on { background: var(--faint); opacity: 0.45; }
  .arc-row.cold    .arc-meter i.on { background: var(--hair); }

  .arc-name {
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color .13s;
  }
  .arc-row.cold .arc-name { color: var(--faint); }
  .arc-nums {
    font-size: 11.5px;
    color: var(--faint);
    white-space: nowrap;
  }
  .arc-nums b { color: var(--ink-soft); font-weight: 600; }
  .arc-row.cold .arc-nums b { color: var(--faint); }
  .arc-nums .sep { opacity: 0.35; margin: 0 6px; }

  .arc-detail {
    padding: 2px 0 18px 68px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .arc-detail dt {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 4px;
  }
  .arc-detail dd {
    font-size: 15px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .arc-detail ol { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .arc-detail ol li {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 10px;
    font-size: 14.5px;
    line-height: 1.72;
    color: var(--muted);
  }
  .arc-detail ol li span {
    font-size: 11px;
    color: var(--faint);
    padding-top: 2px;
  }

  /* ══ 날짜 메뉴 ═════════════════════════════════
     칩 상자 대신 탭이다. 고른 날짜만 아래 선으로 표시한다. */
  .datenav {
    display: flex;
    gap: 26px;
    margin-top: 32px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    border-bottom: 1px solid var(--hair);
  }
  .datechip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 4px 0 11px;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    color: var(--faint);
    cursor: pointer;
    text-align: left;
    transition: color .13s, border-color .13s;
  }
  .datechip:hover { color: var(--ink-soft); }
  .datechip[aria-pressed="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .datechip .d {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.3;
    color: inherit;
  }
  .datechip .w {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--faint);
    line-height: 1.3;
  }
  .datechip[aria-pressed="true"] .w { color: var(--accent); }
  .datechip.all .d { font-family: var(--sans); font-size: 14.5px; }

  /* ══ 주제 필터 ═════════════════════════════════
     알약 상자를 걷어내고 글자만 남긴다. 고른 것만 잉크색이 된다. */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    margin: 20px 0 44px;
  }
  .filters[hidden] { display: none; }
  .chip {
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 500;
    padding: 2px 0;
    border: 0;
    background: none;
    color: var(--faint);
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color .13s, border-color .13s;
  }
  .chip:hover { color: var(--ink-soft); }
  .chip[aria-pressed="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .chip .count {
    font-size: 10.5px;
    color: var(--faint);
    margin-left: 6px;
    letter-spacing: 0.04em;
  }
  .chip[aria-pressed="true"] .count { color: var(--accent); }

  /* ══ 타임라인 ══════════════════════════════════ */
  .timeline { display: flex; flex-direction: column; }

  .day {
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    gap: var(--gap);
    padding: 44px 0;
    border-top: 1px solid var(--hair);
  }
  .day:first-child { border-top: none; padding-top: 0; }

  .daymark {
    position: sticky;
    top: 24px;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .daymark .md {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .daymark .yr {
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.1em;
  }
  .daymark .wd { font-size: 13.5px; color: var(--muted); }
  .badge-today {
    align-self: flex-start;
    margin-top: 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 3px 0;
    color: var(--accent);
    border-top: 1px solid var(--accent);
  }

  .daybody { display: flex; flex-direction: column; gap: 34px; min-width: 0; }

  /* 한눈에 보기 — 번호는 중요도 순서를 뜻한다. 장식이 아니다 */
  .digest { display: flex; flex-direction: column; gap: 15px; }
  .digest h3 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
  }
  .digest ul { display: flex; flex-direction: column; gap: 14px; }
  .digest li {
    list-style: none;
    display: grid;
    grid-template-columns: 30px 1fr;
    font-size: 18px;
    line-height: 1.88;
    color: var(--ink-soft);
  }
  .digest li::before {
    content: "";
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    padding-top: 5px;
  }
  .digest li:nth-child(1)::before { content: "01"; }
  .digest li:nth-child(2)::before { content: "02"; }
  .digest li:nth-child(3)::before { content: "03"; }
  .digest li:nth-child(4)::before { content: "04"; }
  .digest li:nth-child(5)::before { content: "05"; }
  .digest strong { font-weight: 700; color: var(--ink); }

  /* 그래서 뭐? — 브리핑에서 유일하게 사실이 아닌 층이다.
     배경·좌측 액센트 바·"사실이 아니라 판단입니다" 문구를 없애지 않는다. */
  .insight {
    background: var(--accent-bg);
    border-left: 2px solid var(--accent);
    padding: 20px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .insight-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .insight-head h3 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .insight-head .caveat {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0;
    text-transform: none;
    font-family: var(--sans);
  }
  .insight dl { display: flex; flex-direction: column; gap: 14px; }
  .insight dt {
    font-size: 10.5px;
    letter-spacing: 0.13em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .insight dd {
    font-size: 16px;
    line-height: 1.88;
    color: var(--ink-soft);
  }
  .insight strong { font-weight: 700; color: var(--ink); }

  /* 진행 중인 흐름 배지 — 지표가 아니라 맥락 표시다 */
  .arc {
    align-self: flex-start;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--accent);
    padding: 1px 0;
    border-bottom: 1px solid var(--hair);
  }
  .arc::before { content: "↳ "; color: var(--faint); }
  .brief .arc { flex: 0 0 auto; font-size: 10px; border-bottom: 0; }

  /* ══ 주제 섹션 ═════════════════════════════════ */
  .topic { display: flex; flex-direction: column; gap: 20px; }
  .topic-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--ink);
  }
  .topic-head h3 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.005em;
  }
  .topic-head .n {
    font-size: 11px;
    color: var(--faint);
    margin-left: auto;
    letter-spacing: 0.06em;
  }

  /* 본문 글줄에 폭 제한을 두지 않는다 — 화면을 꽉 채우는 쪽을 골랐다.
     읽기 좋은 길이(45~75자)보다 길어지므로 행간을 1.86~1.9로 올려 보완한다.
     되돌리려면 .digest li / .item h4·p / .insight dd / .note 등에
     max-width를 다시 주면 된다. */
  .item { display: flex; flex-direction: column; gap: 8px; }
  .item h4 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.42;
    letter-spacing: -0.015em;
    text-wrap: pretty;
  }
  .item p {
    font-size: 16.5px;
    color: var(--ink-soft);
    line-height: 1.9;
  }
  .sources { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 3px; }
  .src {
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .13s, border-color .13s;
  }
  .src::before { content: "→ "; color: var(--faint); }
  .src:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* 그 외 — 한 줄 항목 */
  .briefs-head {
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin-top: 8px;
  }
  .briefs { display: flex; flex-direction: column; }
  .brief {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--hair-soft);
    font-size: 16px;
    line-height: 1.72;
    color: var(--ink-soft);
  }
  .brief:first-child { border-top: 1px solid var(--hair-soft); }
  .brief > span { flex: 1 1 24ch; min-width: 0; }
  .brief .src { flex: 0 0 auto; }

  .note {
    border-left: 1px solid var(--hair);
    padding: 3px 0 3px 18px;
    font-size: 15px;
    line-height: 1.86;
    color: var(--muted);
  }
  .note b {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .note ul { margin-top: 6px; padding-left: 16px; }
  .note li { margin-bottom: 5px; }

  .daymeta {
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.7;
    padding-top: 14px;
    border-top: 1px solid var(--hair-soft);
  }

  .empty {
    font-size: 14px;
    color: var(--faint);
    padding: 56px 0;
    text-align: center;
    letter-spacing: 0.04em;
  }

  footer {
    margin-top: 64px;
    padding-top: 22px;
    border-top: 1px solid var(--hair);
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.8;
  }
  footer .byline {
    display: block;
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  footer code {
    font-family: var(--mono);
    color: var(--muted);
  }

  /* ══ 주간 회고 ═════════════════════════════════
     일간과 같은 타임라인 자리에 뜨지만 단위가 한 주다.
     판단 층은 일간과 **같은 .insight 블록**을 쓴다 — 주간이라고 사실과 판단의
     구분을 느슨하게 하지 않는다. */
  .weekly { display: flex; flex-direction: column; gap: 26px; }
  .wk-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--ink);
  }
  .wk-head h2 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .wk-head .range {
    font-size: 11.5px;
    color: var(--faint);
    letter-spacing: 0.04em;
  }
  .wk-block { display: flex; flex-direction: column; gap: 15px; }
  .wk-block > h3 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--ink);
  }

  .wk-moved { display: flex; flex-direction: column; }
  .wk-moved > div {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 7px 16px;
    padding: 15px 0;
    border-bottom: 1px solid var(--hair-soft);
  }
  .wk-moved > div:last-child { border-bottom: 0; }
  .wk-moved b { font-size: 18px; font-weight: 700; letter-spacing: -0.012em; }
  .wk-moved .p {
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .wk-moved p {
    grid-column: 1 / -1;
    font-size: 16px;
    line-height: 1.88;
    color: var(--ink-soft);
  }

  .wk-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
  }
  .wk-metrics > div {
    padding: 15px 18px 14px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .wk-metrics > div + div {
    border-left: 1px solid var(--hair-soft);
    padding-left: 18px;
  }
  .wk-metrics .l {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .wk-metrics .v {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .wk-metrics .v i { color: var(--faint); font-style: normal; margin: 0 5px; }
  .wk-metrics .d { font-size: 11.5px; color: var(--faint); }
  .wk-metrics .d.up   { color: var(--up); }
  .wk-metrics .d.down { color: var(--down); }

  .wk-watch { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  .wk-watch h4 {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .wk-watch ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .wk-watch li {
    font-size: 15px;
    line-height: 1.72;
    color: var(--ink-soft);
    padding-left: 15px;
    position: relative;
  }
  .wk-watch li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.68em;
    width: 7px;
    height: 1px;
    background: var(--faint);
  }

  /* ══ 좁은 화면 ═════════════════════════════════ */
  @media (max-width: 720px) {
    .page { padding: 34px 18px 64px; }
    .day {
      grid-template-columns: 1fr;
      gap: 18px;
      padding: 30px 0;
    }
    .daymark {
      position: static;
      flex-direction: row;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--ink);
    }
    .daymark .md { font-size: 26px; }
    .badge-today { margin-top: 0; border-top: 0; }
    .item h4 { font-size: 17.5px; }
    .datenav { gap: 18px; }
    .arc-row > summary { grid-template-columns: 44px minmax(0, 1fr); }
    .arc-nums { grid-column: 2; }
    .arc-detail { padding-left: 0; }
    .stat + .stat { border-left: 0; padding-left: 0; }
    .wk-metrics > div + div { border-left: 0; padding-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media print {
    body { background: #fff; }
    .datenav, .filters, .arcs { display: none; }
  }

  [hidden] { display: none !important; }
  .market-context { margin: 20px 0; }
  .market-context > summary { cursor: pointer; padding: 12px 0; border-bottom: 1px solid var(--hair); font: 13px var(--sans); }
  .market-context > summary span { font: 11px var(--mono); color: var(--muted); margin-left: 14px; }
  .reader { border-bottom: 1px solid var(--hair); padding: 4px 0 20px; }
  .reader-modes, .reader-tools { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; }
  .reader-modes { margin-bottom: 16px; }
  .reader-tools { font: 13px var(--sans); color: var(--muted); }
  .reader-tools label { display: flex; align-items: center; gap: 8px; }
  .reader-tools select, .reader-tools input[type="search"] {
    min-width: 0; max-width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 0; padding: 9px; font: 14px var(--sans);
  }
  .search-label { flex: 1 1 230px; }
  .search-label input { flex: 1; width: 100%; }
  .reader-status, .edition-status { font: 12px/1.8 var(--sans); color: var(--muted); margin-top: 14px; }
  .edition-status { padding: 12px 0; border-bottom: 1px solid var(--hair); margin: 0 0 20px; }
  .article-meta { font: 11px/1.8 var(--mono); color: var(--muted); margin: 5px 0; font-variant-numeric: tabular-nums; }
  .item .change { font-size: 14px; border-left: 1px solid var(--hair); padding-left: 12px; }
  .top-rank { font: 13px var(--mono); color: var(--muted); margin-right: 12px; }
  @media print { .reader { display: none; } }

  .event-panel { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .event-panel > summary { cursor: pointer; font: 14px var(--sans); }
  .event-panel > summary span { font: 11px var(--mono); color: var(--muted); margin-left: 12px; }
  .event-caveat { font: 12px/1.8 var(--sans); color: var(--muted); margin: 14px 0; }
  .agenda-row { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--hair-soft); }
  .agenda-date, .event-count { font: 12px/1.8 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .agenda-row h3, .event-group h3 { font: 600 17px/1.8 var(--serif); }
  .agenda-row p { font-size: 14px; }
  .event-group { padding: 24px 0; border-bottom: 1px solid var(--hair); }
  .event-group > .item { padding-bottom: 8px; }
  .event-history { margin-top: 12px; }
  .event-history > summary { cursor: pointer; font: 13px var(--sans); color: var(--muted); }
  .spread-row { padding: 15px 0; border-top: 1px solid var(--hair-soft); }
  @media (max-width: 720px) { .agenda-row { grid-template-columns: 76px minmax(0,1fr); gap: 12px; } }

  .workspace-nav { display:flex; gap:24px; border-bottom:1px solid var(--hair); margin:22px 0; }
  .workspace-nav button { padding:12px 0; }
  .home-section { padding:26px 0; border-bottom:1px solid var(--hair); }
  .home-heading { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .home-heading h2 { font:600 24px/1.5 var(--serif); }
  .home-heading h3, .flow-card h3 { font:600 19px/1.7 var(--serif); }
  .home-kicker { font:11px/1.8 var(--mono); color:var(--muted); letter-spacing:.08em; }
  .home-intro { font:16px/1.8 var(--serif); color:var(--ink-soft); max-width:none; }
  .home-actions { display:flex; gap:12px 20px; flex-wrap:wrap; align-items:center; }
  .home-actions button, .flow-card summary { font:13px/1.8 var(--sans); cursor:pointer; }
  .home-actions button { background:transparent; color:var(--ink); border:0; border-bottom:1px solid var(--hair); padding:7px 0; }
  .home-actions button[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
  .change-row { display:grid; grid-template-columns:90px minmax(0,1fr); gap:20px; padding:18px 0; border-top:1px solid var(--hair-soft); }
  .change-row h3 { font:600 18px/1.8 var(--serif); }
  .change-row p, .flow-card p { font:15px/1.8 var(--serif); max-width:none; }
  .change-kind { font:12px/1.8 var(--mono); color:var(--muted); }
  .flow-card { padding:24px 0; border-top:1px solid var(--hair); }
  .flow-card summary { margin:14px 0; color:var(--muted); }
  .evidence-pair { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:16px 0; }
  .evidence-pair > div { min-width:0; }
  .evidence-pair h4 { font:600 16px/1.8 var(--serif); }
  .flow-evidence { padding:14px 0; border-top:1px solid var(--hair-soft); }
  .home-empty { font:14px/1.8 var(--sans); color:var(--muted); padding:16px 0; }
  .memo-output { width:100%; min-height:240px; padding:14px; font:14px/1.8 var(--sans); background:var(--surface); color:var(--ink); border:1px solid var(--hair); margin-top:16px; }
  .home-coverage { margin:14px 0; font:12px/1.8 var(--sans); color:var(--muted); }
  .home-coverage summary { cursor:pointer; }
  .home-status { font:12px/1.8 var(--sans); color:var(--muted); }
  @media(max-width:720px) { .change-row { grid-template-columns:1fr; gap:6px; } .evidence-pair { grid-template-columns:1fr; gap:14px; } .home-heading h2 { font-size:22px; } }

  /* Newspaper edition: typographic hierarchy, ruled columns, no decorative cards. */
  .page { max-width:1280px; padding:24px 38px 80px; }
  .masthead { gap:0; padding:0; text-align:center; border-bottom:3px double var(--ink); }
  .paper-topline { display:flex; justify-content:space-between; gap:16px; font:10px/1.6 var(--mono); color:var(--muted); letter-spacing:.08em; padding:0 0 12px; border-bottom:1px solid var(--ink); }
  .masthead h1 { font:700 clamp(42px,7.5vw,82px)/1.4 var(--masthead); letter-spacing:0; padding:18px 0 8px; margin:0; flex-shrink:0; }
  .paper-tagline { font:14px/1.8 var(--serif); letter-spacing:.18em; margin-top:12px; padding:0 0 22px; flex-shrink:0; }
  .masthead .topics { font:11px/1.6 var(--sans); letter-spacing:.13em; padding:10px 0; border-top:1px solid var(--hair); }
  .datenav { margin-top:0; gap:24px; padding-top:12px; }
  .datechip { padding-bottom:9px; }
  .datechip .d { font-size:13px; }
  .workspace-nav { margin:0; gap:30px; border-bottom:1px solid var(--ink); }
  .workspace-nav button { padding:12px 0; font-weight:600; }
  .home-section { padding:26px 0; }
  .edition-desk { display:grid; grid-template-columns:1fr auto; gap:5px 24px; padding:20px 0 16px; }
  .edition-desk > .home-kicker { grid-column:1/-1; }
  .edition-desk .home-heading { grid-column:1/-1; margin:0; }
  .edition-desk h2 { font:700 25px/1.5 var(--serif); }
  .edition-desk .home-intro { font:12px/1.8 var(--sans); max-width:none; grid-column:1/-1; }
  .edition-desk .home-coverage { font-size:10px; margin:4px 0; }
  .reading-guide { font:10px/1.8 var(--sans); color:var(--muted); margin:4px 0; }

const topicName = (name) => TOPIC_CONFIG.aliases[name] || name;
const regionsOf = (item) => item.regions && item.regions.length ? item.regions : ["지역 미분류"];
const isSK = (item, section) => section.topic === "SK 그룹" || (item.entities || []).includes("SK");
const isTop = (item) => Number.isInteger(item.topRank) && item.topRank >= 1 && item.topRank <= 5;
function matchesItem(item, section, topic = activeTopic) {
  if (topic !== ALL && topicName(section.topic) !== topic) return false;
  if (activeRegion !== ALL && !regionsOf(item).includes(activeRegion)) return false;
  if (skOnly && !isSK(item, section)) return false;

function displaySections(day, topic = activeTopic, mode = activeMode) {

    if (target.items.length || target.briefs.length || ((mode === "all" || mode === "events") && target.notes.length)) grouped.set(name, target);

function kstToday() {

function sectionCount(s) {

/* 날짜·주제를 각각 ALL로 열어둘 수 있어서, 두 메뉴의 건수를 같은 함수로 센다. */
function countFor(date, topic) {

  BRIEFINGS.forEach((b) => {

/* ── 시장 패널 (환율·유가) ────────────────────────────────
   환율과 유가는 상단 지표 스트립에서 떼어내 전용 패널에서 보여준다.

   페이지는 자체 완결이라 외부 시세를 불러오지 않는다 (CSP가 fetch를 막는다).
   숫자는 매일 아침 루틴이 기사에서 확인해 채워 넣는 것이고, 추이 그래프도
   저장된 브리핑에서만 만든다 — 배열이 7일치로 잘리므로 추이도 7일이다. */

const MARKETS = [
  {
    id: "fx",
    title: "환율",
    field: "fx",
    list: "rates",
    /* 대표 지표. 이 값으로 추이 그래프를 그린다 */
    isMain: (s) => s.startsWith("원/달러"),
    owns: (s) => s.startsWith("원/") || s.replace(/\s+/g, "").startsWith("달러인덱스") || s === "DXY"
  },
  {
    id: "oil",

    owns: (s) => /^(WTI|브렌트|두바이|유가)/i.test(s)

function marketOf(day, spec) {
  if (!day) return { asOf: "", rows: [] };
  const own = day[spec.field];
  if (own && own[spec.list] && own[spec.list].length) {
    return { asOf: own.asOf || "", rows: own[spec.list] };
  }
  const rows = (day.metrics || []).filter((m) => spec.owns(String(m.label || "")));
  const main = rows.filter((m) => spec.isMain(String(m.label || "")))[0];
  return { asOf: (main && main.note) || "", rows: rows };
}

/* "1,368.6" → 1368.6, "$85.76" → 85.76. 숫자로 못 읽히면 NaN을 돌려 호출부에서 거른다. */
function mktNum(v) {
  const n = parseFloat(String(v).replace(/,/g, "").replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : NaN;
}

/* 날짜를 일 단위 정수로. 가로축을 날짜 간격에 비례시키는 데 쓴다 */
function dayNum(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

function mktSeries(spec) {
  const pts = [];
  BRIEFINGS.forEach((b) => {
    const main = marketOf(b, spec).rows.filter((m) => spec.isMain(String(m.label || "")))[0];
    if (!main) return;
    const v = mktNum(main.value);
    if (Number.isFinite(v)) pts.push({ date: b.date, v: v });
  });
  return pts.reverse();   /* BRIEFINGS는 최신이 앞. 그래프는 왼쪽이 과거다 */
}

/* 세로로 늘어나는 그래프라 점(circle)은 타원이 된다. 그래서 고른 날짜는
   원이 아니라 세로 점선으로 표시하고, 선 굵기는 non-scaling-stroke로 지킨다.
   가로 위치는 회차 순번이 아니라 날짜다 — 값이 빠진 날의 간격이 보여야 한다. */
function renderSpark(pts, markDate, label) {
  if (pts.length < 2) return "";
  const W = 300, H = 58, PAD = 5;

  const vs = pts.map((p) => p.v);
  const lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  const span = hi - lo || 1;

  const ds = pts.map((p) => dayNum(p.date));
  const d0 = ds[0], dspan = ds[ds.length - 1] - d0 || 1;

  const x = (i) => PAD + ((ds[i] - d0) / dspan) * (W - PAD * 2);
  const y = (v) => PAD + (H - PAD * 2) * (1 - (v - lo) / span);

  const line = pts.map((p, i) => x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ");
  const area = PAD + "," + (H - PAD) + " " + line + " " + (W - PAD) + "," + (H - PAD);

  const first = pts[0], last = pts[pts.length - 1];
  const dir = last.v > first.v ? "up" : last.v < first.v ? "down" : "flat";

  const at = pts.map((p) => p.date).indexOf(markDate);
  const mark = at >= 0
    ? `<line class="mark" x1="${x(at).toFixed(1)}" y1="0" x2="${x(at).toFixed(1)}" y2="${H}"></line>`
    : "";

  const fmt = (n) => n.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
  const md = (d) => d.slice(5).replace("-", ".");
  /* 며칠에 걸친 몇 회차인지 같이 적는다. 값이 빠진 날이 있으면 둘이 어긋난다 */
  const days = dspan + 1;

  return `
    <div class="spark ${dir}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="${esc(label)} ${days}일 추이 — ${esc(fmt(first.v))}에서 ${esc(fmt(last.v))}">
        <polygon class="area" points="${area}"></polygon>
        ${mark}
        <polyline class="line" points="${line}"></polyline>
      </svg>
      <div class="spark-foot">
        <span>${esc(md(first.date))} ${esc(fmt(first.v))}</span>
        <span>${days}일 · ${pts.length}회차</span>
        <span>${esc(md(last.date))} ${esc(fmt(last.v))}</span>
      </div>
    </div>`;
}

function mktDir(m) {
  return m.dir === "up" ? "up" : m.dir === "down" ? "down" : "";
}

function mktValue(m) {
  return `${esc(m.value)}${m.unit ? `<span class="unit">${esc(m.unit)}</span>` : ""}`;
}

function renderMarket(spec, shown) {
  const el = $(spec.id);
  if (!el) return;

  const data = marketOf(shown, spec);
  if (!data.rows.length) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;

  const main = data.rows.filter((m) => spec.isMain(String(m.label || "")))[0];
  const rest = data.rows.filter((m) => m !== main);

  const mainBox = main ? `
    <div class="mkt-main">
      <span class="stat-label">${esc(main.label)}</span>
      <div class="big">
        <b>${mktValue(main)}</b>
        <span class="d ${mktDir(main)}">${esc(main.delta || "")}</span>
      </div>
      ${main.note && main.note !== data.asOf
        ? `<div class="mkt-note">${esc(main.note)}</div>` : ""}
      ${renderSpark(mktSeries(spec), shown ? shown.date : "", main.label)}
    </div>`
    : `<div class="mkt-empty">이 날은 대표 지표가 기록되지 않았습니다</div>`;

  const restBox = rest.length ? `
    <div class="mkt-rows">
      ${rest.map((m) => `
        <div class="mkt-row">
          <span class="n">${esc(m.label)}</span>
          <span class="v">${mktValue(m)}</span>
          <span class="d ${mktDir(m)}">${esc(m.delta || m.note || "")}</span>
        </div>`).join("")}
    </div>` : "";

  el.innerHTML = `
    <div class="mkt-head">
      <h2>${esc(spec.title)}</h2>
      <span class="asof">${esc(data.asOf || (shown ? shown.date : ""))}</span>
    </div>
    <div class="mkt-body">
      ${mainBox}
      ${restBox}
    </div>`;
}

function renderMarkets() {
  const shown = selectedDay() || BRIEFINGS[0];
  MARKETS.forEach((spec) => renderMarket(spec, shown));
}

function renderNote(note) {

function renderSources(sources) {

}

function renderArc(arc) {

function renderItem(item) {

    <article class="item">

function renderBriefs(briefs) {

    <div class="briefs">
      ${briefs.map((b) => `
        <div class="brief">

          ${renderArticleMeta(b)}

function renderInsight(insight) {
  if (!insight || !insight.length) return "";

    .filter((x) => x && x.text)
    .map((x) => `<div><dt>${esc(x.label)}</dt><dd>${x.text}</dd></div>`)

  if (!rows) return "";
  return `
    <div class="insight">
      <div class="insight-head">
        <h3>그래서 뭐?</h3>
        <span class="caveat">사실이 아니라 판단입니다. 위 항목만 재료로 씁니다</span>

}

/* ── 흐름 온도계 ───────────────────────────────────────────
   ARCS는 tools/sync_arcs.py가 상태/추적.md에서 뽑아 넣는다. 여기서 하는 일은
   타임라인 날짜를 세는 것뿐이다 — 최근 7일에 몇 번 진전했나, 그 앞 7일과 비교해
   늘었나 줄었나, 마지막 진전이 며칠 전인가.

   **새 사실을 만들지 않는다.** 온도는 판단이 아니라 대장에 적힌 날짜의 집계다.
   그래서 "그래서 뭐?" 블록의 액센트 배경을 쓰지 않고, 액센트 농도로만 나타낸다.

   기준일은 뷰어의 시계가 아니라 **최신 브리핑 날짜**다. 페이지가 오래 방치돼도
   숫자가 저 혼자 식지 않게 하려는 것이다. */

let ARC_WINDOW = 7;      /* 최근 N일 */
const ARC_METER = 5;       /* 계기 칸 수 */

function arcAnchor() {
  return BRIEFINGS.length ? BRIEFINGS[0].date : TODAY;
}

function daysBetween(a, b) {
  return dayNum(b) - dayNum(a);
}

function arcHeat(arc, anchor) {
  let recent = 0, prior = 0;
  (arc.timeline || []).forEach((e) => {
    const gap = daysBetween(e.date, anchor);
    if (gap < 0) return;                       /* 기준일보다 미래면 세지 않는다 */
    if (gap < ARC_WINDOW) recent++;
    else if (gap < ARC_WINDOW * 2) prior++;
  });
  const since = arc.last ? daysBetween(arc.last, anchor) : null;

  let temp = "cold";
  if (recent >= 3) temp = "hot";
  else if (recent >= 1) temp = "warm";
  else if (prior >= 1) temp = "cooling";

  const trend = recent > prior ? "↑" : recent < prior ? "↓" : "→";
  return { recent: recent, prior: prior, since: since, temp: temp, trend: trend };
}

const ARC_ORDER = { hot: 0, warm: 1, cooling: 2, cold: 3 };

function arcRows() {
  const anchor = arcAnchor();
  return (typeof ARCS === "undefined" ? [] : ARCS)
    .filter((a) => a.status === "active")
    .map((a) => ({ arc: a, heat: arcHeat(a, anchor) }))
    .sort((x, y) =>
      (ARC_ORDER[x.heat.temp] - ARC_ORDER[y.heat.temp]) ||
      (y.heat.recent - x.heat.recent) ||
      (y.arc.count - x.arc.count));
}

function renderArcs() {
  const el = $("arcs");
  if (!el) return;

  const rows = arcRows();
  if (!rows.length) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;

  const anchor = arcAnchor();
  const moved = rows.filter((r) => r.heat.recent > 0).length;
  const md = (d) => d.slice(5).replace("-", ".");

  const body = rows.map((r) => {
    const a = r.arc, h = r.heat;
    const cells = [];
    for (let i = 0; i < ARC_METER; i++) {
      cells.push(`<i class="${i < Math.min(h.recent, ARC_METER) ? "on" : ""}"></i>`);
    }
    /* 타임라인은 최근 것부터 넉넉히 5줄까지. 대장은 오래된 것부터 적혀 있다 */
    const tl = (a.timeline || []).filter((entry) => { const gap = daysBetween(entry.date, anchor); return gap >= 0 && gap < ARC_WINDOW; }).slice().reverse();

    return `
      <details class="arc-row ${h.temp}">
        <summary>
          <span class="arc-meter" aria-hidden="true">${cells.join("")}</span>
          <span class="arc-name">${esc(a.name)}</span>
          <span class="arc-nums">
            <b>${h.recent}</b>${esc(h.trend)}<span class="sep">·</span>총 ${a.count}회<span class="sep">·</span>${
              h.since === null ? "—" : h.since === 0 ? "오늘" : h.since + "일 전"}
          </span>
        </summary>
        <dl class="arc-detail">
          <div><dt>지금</dt><dd>${esc(a.state)}</dd></div>
          ${a.next ? `<div><dt>다음 분기점</dt><dd>${esc(a.next)}</dd></div>` : ""}
          <div>
            <dt>타임라인 (${ARC_WINDOW}일 · ${tl.length}줄 · 시작 ${esc(md(a.since))})</dt>
            <dd><ol>${tl.map((e) =>
              `<li><span>${esc(md(e.date))}</span>${esc(e.text)}</li>`).join("")}</ol></dd>
          </div>
        </dl>
      </details>`;
  }).join("");

  el.innerHTML = `
    <summary>
      <h2>진행 중인 흐름</h2>
      <span class="tally">${rows.length}개 · 최근 ${ARC_WINDOW}일 움직인 것 ${moved}개</span>
    </summary>
    <div class="arcs-body">
      <div class="reader-tools"><label>집계 기간 <select id="arc-window" aria-label="흐름 집계 기간"><option value="7" ${ARC_WINDOW === 7 ? "selected" : ""}>7일</option><option value="30" ${ARC_WINDOW === 30 ? "selected" : ""}>30일</option></select></label></div>
      <div class="arcs-caveat">
        추적 대장에 적힌 <b>진전 횟수를 센 것</b>입니다 — 판단이 아니라 집계입니다.
        계기는 최근 ${ARC_WINDOW}일 진전 수, 화살표는 그 앞 ${ARC_WINDOW}일과 비교한 것입니다.
        기준일은 최신 브리핑(${esc(md(anchor))})입니다. 세계 보도량이나 인기도를 뜻하지 않습니다.
      </div>
      ${body}
    </div>`;
  $("arc-window").addEventListener("change", (event) => {
    ARC_WINDOW = Number(event.target.value); renderArcs();
  });
}

/* ── 주간 회고 ─────────────────────────────────────────────
   날짜 메뉴의 "주간" 칩을 고르면 타임라인 자리에 뜬다. 일간과 달리
   새로 검색해 만든 것이 아니라, 그 주 브리핑과 추적 대장을 되짚은 것이다. */

function renderWeekly() {
  const list = (typeof WEEKLIES === "undefined" ? [] : WEEKLIES);
  if (!list.length) {
    return `<div class="empty">아직 주간 회고가 없습니다 — 월요일 아침에 만들어집니다</div>`;
  }
  const md = (d) => d.slice(5).replace("-", ".");

  return `<div class="weekly">${list.map((w) => `
    <section class="day">
      <div class="daymark">
        <span class="md">${esc(md(w.to))}</span>
        <span class="yr">${esc(w.to.slice(0, 4))}</span>
        <span class="wd">주간</span>
      </div>
      <div class="daybody">
        <div class="wk-head">
          <h2>${esc(w.label)}</h2>
          <span class="range">${esc(md(w.from))} — ${esc(md(w.to))} · ${esc(w.writtenAt)} 작성</span>
        </div>

        ${w.digest && w.digest.length ? `
          <div class="digest">
            <h3>이번 주 세 줄</h3>
            <ul>${w.digest.map((t) => `<li><span>${t}</span></li>`).join("")}</ul>
          </div>` : ""}

        ${renderInsight(w.insight)}

        ${w.arcs && w.arcs.length ? `
          <div class="wk-block">
            <h3>움직인 흐름</h3>
            <div class="wk-moved">
              ${w.arcs.map((a) => `
                <div>
                  <b>${esc(a.name)}</b>
                  <span class="p">이번 주 ${a.progress}회 · 누적 ${a.total}회</span>
                  <p>${esc(a.note)}</p>
                </div>`).join("")}
            </div>
          </div>` : ""}

        ${w.metrics && w.metrics.length ? `
          <div class="wk-block">
            <h3>주간 지표</h3>
            <div class="wk-metrics">
              ${w.metrics.map((m) => `
                <div>
                  <span class="l">${esc(m.label)}</span>
                  <span class="v">${esc(m.from)}<i>→</i>${esc(m.to)}</span>
                  <span class="d ${m.dir === "up" ? "up" : m.dir === "down" ? "down" : ""}">${esc(m.delta)}</span>
                </div>`).join("")}
            </div>
          </div>` : ""}

        ${(w.closed && w.closed.length) || (w.opened && w.opened.length) ? `
          <div class="wk-block">
            <h3>워치리스트</h3>
            <div class="wk-watch">
              ${w.closed && w.closed.length ? `
                <div>
                  <h4>닫힌 것 ${w.closed.length}건</h4>
                  <ul>${w.closed.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
                </div>` : ""}
              ${w.opened && w.opened.length ? `
                <div>
                  <h4>새로 연 것 ${w.opened.length}건</h4>
                  <ul>${w.opened.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
                </div>` : ""}
            </div>
          </div>` : ""}

        <div class="daymeta">${esc(w.note)}</div>
      </div>
    </section>`).join("")}</div>`;
}

function renderTimeline() {
  if (activeMode === "events" && activeDate !== WEEK) {
    $("timeline").innerHTML = renderEventView();
    return;
  }
  /* "주간"을 고르면 일간 대신 주간 회고를 보여준다 */
  if (activeDate === WEEK) {
    $("timeline").innerHTML = renderWeekly();
    return;
  }

  const days = BRIEFINGS.filter((b) => activeDate === ALL || b.date === activeDate).map((b) => {
    const sections = displaySections(b);
    if (!sections.length) return "";

    const [y, m, d] = b.date.split("-");
    const unfiltered = activeTopic === ALL && activeRegion === ALL && !searchQuery && !skOnly;
    const showDigest = unfiltered && b.digest && b.digest.length;
    const showInsight = unfiltered;

    return `
      <section class="day">
        <div class="daymark">
          <span class="md">${m}.${d}</span>
          <span class="yr">${y}</span>
          <span class="wd">${esc(b.weekday)}요일</span>
          ${b.date === TODAY ? '<span class="badge-today">오늘</span>' : ""}
        </div>
        <div class="daybody">
          ${editionStatus(b)}
          ${showDigest ? `
            <div class="digest">
              <h3>한눈에 보기</h3>
              <ul>${b.digest.map((t) => `<li><span>${t}</span></li>`).join("")}</ul>
            </div>` : ""}
          ${showInsight ? renderInsight(b.insight) : ""}
          ${activeMode === "top" ? sections.flatMap((s) => s.items).sort((a, b) => a.topRank - b.topRank).map(renderItem).join("") : sections.map((s) => `
            <div class="topic">
              <div class="topic-head">
                <h3>${esc(s.topic)}</h3>
                <span class="n">${sectionCount(s)}건</span>
              </div>
              ${(s.items || []).map(renderItem).join("")}
              ${renderBriefs(s.briefs)}
              ${(s.notes || []).map(renderNote).join("")}
            </div>`).join("")}
          <div class="daymeta">
            수집 ${esc(b.collectedAt)} · ${esc(b.window)}${b.tally ? " · " + esc(b.tally) : ""}
          </div>
        </div>
      </section>`;
  }).join("");

  const none = activeMode === "top"
    ? "현재 조건에 핵심 선정 기사가 없습니다. 주요 또는 전체 뉴스로 바꾸거나 필터를 초기화해 보세요."
    : "현재 조건에 맞는 기사가 없습니다. 지역·주제·검색어를 바꾸거나 필터를 초기화해 보세요.";
  $("timeline").innerHTML = days || `<div class="empty">${esc(none)}</div>`;
}


function eventAnchor() { return selectedDay()?.date || BRIEFINGS[0]?.date || TODAY; }
function publishedRows() {
  return BRIEFINGS.flatMap(day => day.sections.flatMap(section => [...(section.items||[]), ...(section.briefs||[])].map(item => ({day,section,item}))));
}
function eventFor(row, anchor) {
  return EVENT_DATA.events.find(event => event.reviewedAt <= anchor && (row.item.eventId === event.id || event.members.some(ref => ref.date === row.day.date && ref.title === row.item.title)));
}
function renderEventView() {
  const anchor = eventAnchor();
  const all = publishedRows();
  const visible = all.filter(row => (activeDate === ALL || row.day.date === activeDate) && matchesItem(row.item,row.section));
  const groups = new Map();
  visible.forEach((row,index) => {
    const event = eventFor(row,anchor);
    const id = event?.id || `single-${index}`;
    if (!groups.has(id)) groups.set(id,{event,rows:[]});
    groups.get(id).rows.push(row);
  });
  if (!groups.size) return '<div class="empty">현재 조건에 맞는 사건이 없습니다.</div>';
  return `<p class="event-caveat">${visible.length}개 항목을 ${groups.size}개 묶음으로 표시합니다. 동일 사건으로 검토한 항목만 합칩니다. 출처 수는 독립 취재 건수가 아닙니다.</p>` + [...groups.values()].map(group => {
    const event=group.event, latest=group.rows[0];
    if (!event) return renderItem(latest.item);
    const history=all.filter(row=>row.day.date <= anchor && eventFor(row,anchor)?.id === event.id).sort((a,b)=>b.day.date.localeCompare(a.day.date));
    const sources=[...new Map(history.flatMap(row=>row.item.sources||[]).map(source=>[source.url,source])).values()];
    const publishers=new Set(sources.map(source=>source.name));
    return `<section class="event-group">
      <h3>${esc(event.title)}</h3>
      <p class="event-count">선택 조건 ${group.rows.length}개 항목 · 관련 기록 ${history.length}개 · 출처 이름 ${publishers.size}곳</p>
      ${renderItem(latest.item)}
      <details class="event-history"><summary>사건 경과와 원문 ${history.length}개 기록</summary>

/* Home uses published evidence only. Personal state never leaves this browser. */
let workspaceView = 'home';
const PERSONAL_KEY = 'news-brief-following-v1';
let personal = {following:[], seen:{}};
let personalPersistent = true;
try {

  if (saved && Array.isArray(saved.following)) {
    personal.following = [...new Set(saved.following.filter(x => typeof x === 'string'))].slice(0,200);
    if (saved.seen && typeof saved.seen === 'object' && !Array.isArray(saved.seen)) {
      personal.seen = Object.fromEntries(Object.entries(saved.seen).filter(([k,v]) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)));
    }
  }
} catch (_) { personalPersistent = false; }
function savePersonal() {
  try { localStorage.setItem(PERSONAL_KEY, JSON.stringify(personal)); }

}
function rowArc(row) {
  const label = row.item.arc || '';
  return ARCS.find(arc => label === arc.name || label.startsWith(arc.name + ' ·'));
}
function evidenceRows(anchor) {
  return publishedRows().filter(row => row.day.date <= anchor && row.item.sources?.length)
    .sort((a,b) => b.day.date.localeCompare(a.day.date));
}
function homeChanges(anchor) {
  return evidenceRows(anchor).filter(row => row.day.date === anchor && row.item.status === 'update' && row.item.change);
}
function flowRows(name, anchor) { return evidenceRows(anchor).filter(row => rowArc(row)?.name === name); }
function flowUnread(name, anchor) {
  const seen = personal.seen[name];
  return flowRows(name,anchor).filter(row => !seen || row.day.date > seen);
}
function homeAgenda(anchor) {
  return EVENT_DATA.agenda.filter(entry => entry.recordedAt <= anchor && (!entry.resolvedAt || entry.resolvedAt > anchor))
    .sort((a,b) => a.date.localeCompare(b.date));
}
function flowEvidence(row) {
  return `<div class="home-kicker">${esc(row.day.date)} 게재 · ${esc(topicName(row.section.topic))}</div>
    <h4>${esc(row.item.title)}</h4><p>${esc(row.item.change || row.item.body || '')}</p>
    <div class="sources">${renderSources(row.item.sources)}</div>`;
}
function flowCard(arc, anchor) {
  const rows = flowRows(arc.name,anchor), latest = rows[0];
  const previous = latest && rows.find(row => row.day.date < latest.day.date);
  const following = personal.following.includes(arc.name);
  const unread = flowUnread(arc.name,anchor);
  const current = rows.filter(row => daysBetween(row.day.date,anchor) < 7);
  const regions = [...new Set(current.flatMap(row => row.item.regions || []))];
  // Current editorial next conditions are not historical snapshots; never show them before their revision date.
  const next = arc.last <= anchor && arc.next ? renderInsight([{label:'다음에 확인할 조건',text:esc(arc.next)}]) : '';
  return `<article class="flow-card" data-flow="${esc(arc.name)}">
    <div class="home-heading"><h3>${esc(arc.name)}</h3><div class="home-actions">
      <button type="button" data-follow="${esc(arc.name)}" aria-pressed="${following}">${following?'관심 해제':'이 흐름 계속 보기'}</button>
      ${following && unread.length ? `<button type="button" data-seen="${esc(arc.name)}">${anchor}까지 확인 완료</button>`:''}
    </div></div>
    <div class="article-meta">최근 7일 게재 ${current.length}건${regions.length?' · '+esc(regions.join(' · ')):''}${following?' · '+(personal.seen[arc.name] ? `마지막 확인 ${esc(personal.seen[arc.name])} · 이후 ${unread.length}건` : `미확인 ${unread.length}건`):''}</div>
    ${latest ? `<div class="evidence-pair"><div><div class="home-kicker">이전 기록</div>${previous?flowEvidence(previous):'<p class="home-empty">보관된 회차에 이전 근거가 없습니다.</p>'}</div><div><div class="home-kicker">최근 기록</div>${flowEvidence(latest)}</div></div>` : '<p class="home-empty">보관된 회차에 연결된 기사가 없습니다. 새 진전이 없다고 단정할 수는 없습니다.</p>'}

function createHomeMemo(anchor, following) {
  const parts=[`${anchor} ${following?'관심 흐름':'오늘의 변화'} — 뉴스 브리핑`];
  const append = row => {
    parts.push(`\n[${row.day.date} 게재] ${row.item.title}`, row.item.change || row.item.body || '');
    (row.item.sources||[]).forEach(source=>parts.push(`${source.name}: ${source.url}`));
  };
  if(following) {
    personal.following.forEach(name=>{
      const rows=flowUnread(name,anchor); parts.push(`\n■ ${name} — 미확인 ${rows.length}건`);
      rows.forEach(append);
    });
    if(!personal.following.length) parts.push('선택한 관심 흐름이 없습니다.');
  } else {
    const rows=homeChanges(anchor);
    if(rows.length) rows.forEach(append); else parts.push('이 회차에 기록된 후속 진전이 없습니다.');
    parts.push('\n다음 확인 일정');
    homeAgenda(anchor).forEach(entry=>{
      parts.push(`${entry.date} ${entry.title} (${entry.dateType==='review'?'재확인일':entry.certainty==='tentative'?'잠정 일정':'보도된 예정일'}${entry.date<anchor?' · 결과 확인 필요':''})`);
      entry.sources.forEach(source=>parts.push(`${source.name}: ${source.url}`));
    });
  }
  parts.push(`\n보관된 ${BRIEFINGS.length}개 회차의 기록 기준. https://vincedklee.github.io/news-brief-dashboard/`);
  $('memo-output').value=parts.join('\n'); $('memo-output').hidden=false;
  $('memo-output').focus(); $('memo-output').select();
  $('memo-status').textContent='메모를 만들었습니다. 선택된 내용을 복사해 사용할 수 있습니다.';
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(parts.join('\n')).then(()=>{
    if($('memo-status')) $('memo-status').textContent='출처를 포함한 메모를 클립보드에 복사했습니다.';
  }).catch(()=>{});
}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setWorkspace(button.dataset.view)));

function renderFoot() {
  const oldest = BRIEFINGS[BRIEFINGS.length - 1];
  const latest = BRIEFINGS[0];
  const range = BRIEFINGS.length > 1 ? `${oldest.date} — ${latest.date}` : latest ? latest.date : "";
  $("foot").innerHTML =
    `<span class="byline">Artifact by DK</span>` +
    `News Brief · ${esc(range)} · ${BRIEFINGS.length}개 브리핑<br>` +
    `<code>/brief</code> 실행 시 갱신됩니다. 모든 항목은 원문 출처 링크를 답니다.`;
}

function render() {
  renderStrip();
  renderMarkets();
  renderArcs();
  renderDates();
  renderFilters();
  renderReader();
  renderEventPanels();
  renderTimeline();
  renderHome();
}

$("region").innerHTML = [ALL, ...TOPIC_CONFIG.regions, "지역 미분류"].map((region) => `<option value="${esc(region)}">${esc(region)}</option>`).join("");
$("region").addEventListener("change", (event) => { activeRegion = event.target.value; render(); });
$("search").addEventListener("input", (event) => { searchQuery = event.target.value.trim(); render(); });
$("sk-only").addEventListener("change", (event) => { skOnly = event.target.checked; render(); });
$("reset-reader").addEventListener("click", () => {
  activeTopic = ALL; activeRegion = ALL; searchQuery = ""; skOnly = false;
  $("region").value = ALL; $("search").value = ""; $("sk-only").checked = false; render();
});
render();
renderFoot();
</script>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("themetoggle");
  if (!btn) return;

  // 저장된 선택이 없으면 data-theme을 비워 두고 prefers-color-scheme에 맡긴다.
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);

  function current() {
    var t = root.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function paint() {
    btn.textContent = current() === "dark" ? "LIGHT" : "DARK";
    btn.setAttribute("aria-label", "테마 전환");
  }

  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paint();
  });

  paint();
})();
</script>
