<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Briefing</title>
<meta name="description" content="매일 아침 AI·반도체·경제·국내 산업·SK 그룹·스타트업 뉴스를 모아 정리한 브리핑.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Morning Briefing">
<meta property="og:description" content="매일 아침 AI·반도체·경제·국내 산업·SK 그룹·스타트업 뉴스를 모아 정리한 브리핑.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
</style>
<!-- 본문용 세리프. CSP가 허용하는 폰트 호스트는 구글 폰트뿐이다.
     가변 폰트 한 벌(400..700)로 받는다 — 정적 네 벌보다 가볍다.
     못 받아와도 아래 --serif의 시스템 세리프로 떨어진다. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400..700&display=swap">

<style>
  /* ══ 토큰 ══════════════════════════════════════
     색은 여기서만 정의한다. 컴포넌트는 토큰을 통해서만 색을 참조한다.

     뉴트럴은 **녹색 쪽으로 치우친 회색**, 액센트는 브론즈, 판단 층 배경은
     아이보리다. 셋이 같은 따뜻한 계열에 있어야 서로 붙는다 — 예전에는 뉴트럴이
     파랑 쪽이라(본문 글자색이 짙은 슬레이트블루) 아이보리와 부딪혔다.

     액센트가 따뜻한 쪽에 있는 이유는 시세 등락색(상승 빨강 --up / 하락 파랑 --down,
     한국 관행)과 겹치지 않기 위해서다. --up/--down 자체는 관행이라 건드리지 않는다. */
  :root {
    --ground:   #E7EAE6;
    --surface:  #FBFCFA;
    --raise:    #F1F4F0;
    --ink:      #131A16;
    --ink-soft: #35403A;
    --muted:    #5C665F;
    --faint:    #7E8880;
    --hair:     #D7DCD5;
    --hair-soft:#E8EBE6;
    --accent:   #8A5E14;
    --accent-bg:#F0E9D8;
    --up:       #C42A44;
    --down:     #1A5F9E;

    /* 본문 세리프. 신문처럼 읽히게 하는 것이 목적이다.
       기사에 해당하는 것은 전부 세리프, 네비게이션·라벨·숫자는 산스/모노 —
       신문에서 기사와 '가구'를 가르는 방식과 같다. */
    --serif: "Noto Serif KR", AppleMyungjo, "Nanum Myeongjo", Batang, 바탕,
             "Times New Roman", serif;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --rail: 116px;
    --gap:  30px;
  }

  /* 뷰어의 테마는 세 상태다 — 명시적 dark, 명시적 light, 그리고 아무것도
     찍히지 않은 기본(system). 기본 상태는 prefers-color-scheme만으로 갈리므로
     :root에 라이트 전체를 두고, 아래 두 블록에서 토큰만 다시 정의한다. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #0E120F;
      --surface:  #151A16;
      --raise:    #1B211C;
      --ink:      #E5E9E4;
      --ink-soft: #BEC6BF;
      --muted:    #8C958D;
      --faint:    #737C75;
      --hair:     #262D27;
      --hair-soft:#1D231E;
      --accent:   #DCA95E;
      --accent-bg:#241E11;
      --up:       #FF7286;
      --down:     #6FAEDF;
    }
  }

  :root[data-theme="dark"] {
    --ground:   #0E120F;
    --surface:  #151A16;
    --raise:    #1B211C;
    --ink:      #E5E9E4;
    --ink-soft: #BEC6BF;
    --muted:    #8C958D;
    --faint:    #737C75;
    --hair:     #262D27;
    --hair-soft:#1D231E;
    --accent:   #DCA95E;
    --accent-bg:#241E11;
    --up:       #FF7286;
    --down:     #6FAEDF;
  }

  :root[data-theme="light"] {
    --ground:   #E7EAE6;
    --surface:  #FBFCFA;
    --raise:    #F1F4F0;
    --ink:      #131A16;
    --ink-soft: #35403A;
    --muted:    #5C665F;
    --faint:    #7E8880;
    --hair:     #D7DCD5;
    --hair-soft:#E8EBE6;
    --accent:   #8A5E14;
    --accent-bg:#F0E9D8;
    --up:       #C42A44;
    --down:     #1A5F9E;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 52px 26px 90px;
  }

  a { color: inherit; }
  :focus-visible {
    outline: 1.5px solid var(--accent);
    outline-offset: 3px;
    border-radius: 1px;
  }

  /* 신문에서 기사와 '가구'를 가르듯, 네비게이션·캡션은 산스로 되돌린다 */
  .masthead .topics, .chip, .datechip, .insight-head .caveat, .arcs-caveat {
    font-family: var(--sans);
  }

  /* 라벨·수치는 모노 — 숫자가 세로로 맞아야 하는 곳 전부 */
  .stat-label, .mkt-head h2, .mkt-head .asof, .mkt-row .n, .mkt-row .d,
  .arcs > summary h2, .arcs > summary .tally, .arc-nums, .arc-detail dt,
  .arc-detail ol li span, .datechip .d, .datechip .w, .chip .count,
  .daymark .yr, .badge-today, .digest h3, .insight-head h3, .insight dt,
  .topic-head .n, .briefs-head, .src, .note b, .daymeta, .empty, footer,
  .spark-foot, .wk-head .range, .wk-block > h3, .wk-moved .p,
  .wk-metrics .l, .wk-metrics .v, .wk-metrics .d, .wk-watch h4, .arc {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  /* ══ 머리 ══════════════════════════════════════ */
  .masthead {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--ink);
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 5.2vw, 54px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.12;
    text-wrap: balance;
  }
  .masthead .topics {
    font-size: 14.5px;
    color: var(--muted);
    letter-spacing: 0.005em;
  }

  /* ══ 지표 스트립 ═══════════════════════════════
     카드가 아니라 발행물의 데이터 밴드다. 배경·바깥 테두리를 두지 않고
     위아래 가는 선과 세로 구분선만 쓴다. */
  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    margin-top: 30px;
  }
  .stat {
    padding: 16px 18px 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .stat + .stat {
    border-left: 1px solid var(--hair-soft);
    padding-left: 18px;
  }
  .stat-label {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .unit {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--faint);
    margin-left: 3px;
  }
  .stat-delta {
    font-family: var(--mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .stat-delta.up   { color: var(--up); }
  .stat-delta.down { color: var(--down); }

  /* ══ 시장 패널 (환율·유가) ══════════════════════
     여기만 카드다. 나머지 영역은 선과 여백으로 나눈다.
     추이 선은 시세 지표라 등락색을 쓴다 — 액센트는 맥락 표시용이라 여기 안 쓴다. */
  .markets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .mkt {
    border: 1px solid var(--hair);
    background: var(--surface);
    padding: 17px 19px 18px;
    min-width: 0;
  }
  .mkt[hidden] { display: none; }
  .mkt-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 15px;
  }
  .mkt-head h2 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .mkt-head .asof {
    font-size: 11.5px;
    color: var(--faint);
    text-align: right;
    min-width: 0;
  }
  .mkt-main .stat-label { font-size: 10.5px; }
  .mkt-main .big {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 3px 11px;
    margin-top: 4px;
  }
  .mkt-main .big b {
    font-family: var(--mono);
    font-size: 31px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.035em;
    line-height: 1.1;
  }
  .mkt-main .big .d {
    font-family: var(--mono);
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .mkt-main .big .d.up   { color: var(--up); }
  .mkt-main .big .d.down { color: var(--down); }
  .mkt-note {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    margin-top: 5px;
  }

  /* 스파크라인 — 저장된 브리핑에서 만든다. 외부 시세를 부르지 않는다 (CSP).
     가로축은 회차 순번이 아니라 날짜 간격이다 — 값이 빠진 날의 간격이 보여야 한다. */
  .spark { margin-top: 15px; max-width: 440px; }
  .spark svg { width: 100%; height: 54px; display: block; }
  .spark.up   { color: var(--up); }
  .spark.down { color: var(--down); }
  .spark.flat { color: var(--faint); }
  .spark .line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .spark .area { fill: currentColor; stroke: none; opacity: 0.07; }
  .spark .mark {
    stroke: currentColor;
    stroke-width: 1;
    stroke-dasharray: 1.5 3;
    opacity: 0.5;
    vector-effect: non-scaling-stroke;
  }
  .spark-foot {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--faint);
    margin-top: 7px;
  }

  .mkt-rows { margin-top: 16px; border-top: 1px solid var(--hair-soft); }
  .mkt-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hair-soft);
  }
  .mkt-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .mkt-row .n {
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .mkt-row .v {
    font-family: var(--mono);
    font-size: 15.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .mkt-row .d {
    font-size: 11.5px;
    color: var(--faint);
    min-width: 4.8em;
    text-align: right;
  }
  .mkt-row .d.up   { color: var(--up); }
  .mkt-row .d.down { color: var(--down); }
  .mkt-empty { color: var(--muted); font-size: 15px; }

  /* ══ 흐름 온도계 ═══════════════════════════════
     카드가 아니라 목록이다 — 테두리 없이 가는 선 하나로 구분한다.
     추적 대장의 타임라인 날짜를 센 **집계**지 판단이 아니다. 그래서 판단 층
     (.insight)의 액센트 배경을 쓰지 않고, 온도는 액센트 농도로만 낸다.
     등락색(--up/--down)은 시세 전용이라 여기 안 쓴다. */
  .arcs {
    margin-top: 34px;
    border-top: 1px solid var(--hair);
  }
  .arcs[hidden] { display: none; }
  .arcs > summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 15px 0 13px;
    cursor: pointer;
    list-style: none;
  }
  .arcs > summary::-webkit-details-marker { display: none; }
  .arcs > summary h2 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .arcs > summary .tally {
    font-size: 11.5px;
    color: var(--faint);
    margin-left: auto;
    text-align: right;
  }
  .arcs > summary::after {
    content: "펼치기";
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--faint);
    border-bottom: 1px solid var(--hair);
    padding-bottom: 1px;
    flex: 0 0 auto;
    margin-left: 4px;
  }
  .arcs[open] > summary::after { content: "접기"; }
  .arcs > summary:hover h2,
  .arcs > summary:hover::after { color: var(--accent); }
  .arcs > summary:hover::after { border-bottom-color: var(--accent); }

  .arcs-caveat {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    padding-bottom: 14px;
  }
  .arcs-caveat b { color: var(--ink-soft); font-weight: 600; }

  .arc-row { border-top: 1px solid var(--hair-soft); }
  .arc-row > summary {
    display: grid;
    grid-template-columns: 54px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
    cursor: pointer;
    list-style: none;
  }
  .arc-row > summary::-webkit-details-marker { display: none; }
  .arc-row > summary:hover .arc-name { color: var(--accent); }

  /* 최근 7일 진전 수. 색이 아니라 농도로 온도를 낸다 */
  .arc-meter { display: flex; gap: 3px; }
  .arc-meter i {
    flex: 1 1 0;
    height: 6px;
    background: var(--hair-soft);
  }
  .arc-row.hot     .arc-meter i.on { background: var(--accent); }
  .arc-row.warm    .arc-meter i.on { background: var(--accent); opacity: 0.5; }
  .arc-row.cooling .arc-meter i.on { background: var(--faint); opacity: 0.45; }
  .arc-row.cold    .arc-meter i.on { background: var(--hair); }

  .arc-name {
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color .13s;
  }
  .arc-row.cold .arc-name { color: var(--faint); }
  .arc-nums {
    font-size: 11.5px;
    color: var(--faint);
    white-space: nowrap;
  }
  .arc-nums b { color: var(--ink-soft); font-weight: 600; }
  .arc-row.cold .arc-nums b { color: var(--faint); }
  .arc-nums .sep { opacity: 0.35; margin: 0 6px; }

  .arc-detail {
    padding: 2px 0 18px 68px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .arc-detail dt {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 4px;
  }
  .arc-detail dd {
    font-size: 15px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .arc-detail ol { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .arc-detail ol li {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 10px;
    font-size: 14.5px;
    line-height: 1.72;
    color: var(--muted);
  }
  .arc-detail ol li span {
    font-size: 11px;
    color: var(--faint);
    padding-top: 2px;
  }

  /* ══ 날짜 메뉴 ═════════════════════════════════
     칩 상자 대신 탭이다. 고른 날짜만 아래 선으로 표시한다. */
  .datenav {
    display: flex;
    gap: 26px;
    margin-top: 32px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    border-bottom: 1px solid var(--hair);
  }
  .datechip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 4px 0 11px;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    color: var(--faint);
    cursor: pointer;
    text-align: left;
    transition: color .13s, border-color .13s;
  }
  .datechip:hover { color: var(--ink-soft); }
  .datechip[aria-pressed="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .datechip .d {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.3;
    color: inherit;
  }
  .datechip .w {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--faint);
    line-height: 1.3;
  }
  .datechip[aria-pressed="true"] .w { color: var(--accent); }
  .datechip.all .d { font-family: var(--sans); font-size: 14.5px; }

  /* ══ 주제 필터 ═════════════════════════════════
     알약 상자를 걷어내고 글자만 남긴다. 고른 것만 잉크색이 된다. */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    margin: 20px 0 44px;
  }
  .filters[hidden] { display: none; }
  .chip {

/* ══════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const ALL = "전체";
const WEEK = "주간";   /* 날짜 메뉴의 특수 값 — 타임라인이 주간 회고로 바뀐다 */

let activeTopic = ALL;
/* 기본값은 최신 브리핑. 지난 날짜는 날짜 메뉴에서 고른다. */
let activeDate = BRIEFINGS.length ? BRIEFINGS[0].date : ALL;

/* 데이터의 isToday는 루틴이 써넣는 값이라, 루틴이 하루 거르면 어제 것이 '오늘'로 남는다.
   그래서 표시용 라벨은 실제 날짜(KST)에서 직접 구한다. */
function kstToday() {
  try {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
  } catch (e) {
    return "";
  }
}
function shiftDate(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
}
const TODAY = kstToday();
const YESTERDAY = TODAY ? shiftDate(TODAY, -1) : "";

function dayLabel(b) {
  if (b.date === TODAY) return "오늘";
  if (b.date === YESTERDAY) return "어제";
  return b.weekday + "요일";
}

function allTopics() {
  const seen = [];
  BRIEFINGS.forEach((b) => b.sections.forEach((s) => {
    if (!seen.includes(s.topic)) seen.push(s.topic);
  }));
  return seen;
}

function sectionCount(s) {
  return (s.items ? s.items.length : 0) + (s.briefs ? s.briefs.length : 0);
}

/* 날짜·주제를 각각 ALL로 열어둘 수 있어서, 두 메뉴의 건수를 같은 함수로 센다. */
function countFor(date, topic) {
  let n = 0;
  BRIEFINGS.forEach((b) => {
    if (date !== ALL && b.date !== date) return;
    b.sections.forEach((s) => {
      if (topic === ALL || s.topic === topic) n += sectionCount(s);
    });
  });
  return n;
}

function selectedDay() {
  return activeDate === ALL ? null : BRIEFINGS.find((b) => b.date === activeDate);
}

function renderStrip() {
  const day = selectedDay();
  const shown = day || BRIEFINGS[0];
  /* 주간 회고를 보는 중이면 날짜 기준 집계가 없다 — 누적으로 센다 */
  const countDate = activeDate === WEEK ? ALL : activeDate;
  const cells = [
    {
      label: day ? "보는 중" : activeDate === WEEK ? "주간 회고" : "최신 브리핑",
      value: shown ? shown.date.slice(5).replace("-", ".") : "—",
      delta: shown ? dayLabel(shown) : ""
    },
    { label: "누적 일수", value: String(BRIEFINGS.length), unit: "일", delta: "" },
    { label: day ? "이 날 항목" : "누적 항목", value: String(countFor(countDate, ALL)), unit: "건", delta: "" }
  ];
  /* 지표는 그 날짜의 것을 보여준다. 지난 날짜를 보면서 오늘 시세를 띄우면 안 된다.
     환율·유가는 아래 전용 패널이 맡으므로 여기서 뺀다 — 두 곳에 같은 숫자가 뜨지 않게.
     패널이 안 뜨는 날(그 종목이 없는 날)은 걸러내지 않는다. */
  const taken = MARKETS.filter((s) => marketOf(shown, s).rows.length);
  if (shown && shown.metrics) {
    cells.push(...shown.metrics.filter(
      (m) => !taken.some((s) => s.owns(String(m.label || "")))));
  }

  $("strip").innerHTML = cells.map((c) => `
    <div class="stat">
      <span class="stat-label">${esc(c.label)}</span>
      <span class="stat-value">${esc(c.value)}${c.unit ? `<span class="unit">${esc(c.unit)}</span>` : ""}</span>
      <span class="stat-delta ${c.dir === "up" ? "up" : c.dir === "down" ? "down" : ""}">${esc(c.delta || c.note || "")}</span>
    </div>`).join("");
}

/* ── 시장 패널 (환율·유가) ────────────────────────────────
   환율과 유가는 상단 지표 스트립에서 떼어내 전용 패널에서 보여준다.
   재료는 그날 브리핑의 fx·oil 필드이고, 없으면(그 필드가 생기기 전 회차)
   metrics에서 해당 종목을 골라낸다.

   페이지는 자체 완결이라 외부 시세를 불러오지 않는다 (CSP가 fetch를 막는다).
   숫자는 매일 아침 루틴이 기사에서 확인해 채워 넣는 것이고, 추이 그래프도
   저장된 브리핑에서만 만든다 — 배열이 7일치로 잘리므로 추이도 7일이다. */

const MARKETS = [
  {
    id: "fx",
    title: "환율",
    field: "fx",
    list: "rates",
    /* 대표 지표. 이 값으로 추이 그래프를 그린다 */
    isMain: (s) => s.startsWith("원/달러"),
    owns: (s) => s.startsWith("원/") || s.replace(/\s+/g, "").startsWith("달러인덱스") || s === "DXY"
  },
  {
    id: "oil",
    title: "유가",
    field: "oil",
    list: "prices",
    isMain: (s) => /^WTI/i.test(s),
    owns: (s) => /^(WTI|브렌트|두바이|유가)/i.test(s)
  }
];

function marketOf(day, spec) {
  if (!day) return { asOf: "", rows: [] };
  const own = day[spec.field];
  if (own && own[spec.list] && own[spec.list].length) {
    return { asOf: own.asOf || "", rows: own[spec.list] };
  }
  const rows = (day.metrics || []).filter((m) => spec.owns(String(m.label || "")));
  const main = rows.filter((m) => spec.isMain(String(m.label || "")))[0];
  return { asOf: (main && main.note) || "", rows: rows };
}

/* "1,368.6" → 1368.6, "$85.76" → 85.76. 숫자로 못 읽히면 NaN을 돌려 호출부에서 거른다. */
function mktNum(v) {
  const n = parseFloat(String(v).replace(/,/g, "").replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : NaN;
}

/* 날짜를 일 단위 정수로. 가로축을 날짜 간격에 비례시키는 데 쓴다 */
function dayNum(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

function mktSeries(spec) {
  const pts = [];
  BRIEFINGS.forEach((b) => {
    const main = marketOf(b, spec).rows.filter((m) => spec.isMain(String(m.label || "")))[0];
    if (!main) return;
    const v = mktNum(main.value);
    if (Number.isFinite(v)) pts.push({ date: b.date, v: v });
  });
  return pts.reverse();   /* BRIEFINGS는 최신이 앞. 그래프는 왼쪽이 과거다 */
}

/* 세로로 늘어나는 그래프라 점(circle)은 타원이 된다. 그래서 고른 날짜는
   원이 아니라 세로 점선으로 표시하고, 선 굵기는 non-scaling-stroke로 지킨다.
   가로 위치는 회차 순번이 아니라 날짜다 — 값이 빠진 날의 간격이 보여야 한다. */
function renderSpark(pts, markDate, label) {
  if (pts.length < 2) return "";
  const W = 300, H = 58, PAD = 5;

  const vs = pts.map((p) => p.v);
  const lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  const span = hi - lo || 1;

  const ds = pts.map((p) => dayNum(p.date));
  const d0 = ds[0], dspan = ds[ds.length - 1] - d0 || 1;

  const x = (i) => PAD + ((ds[i] - d0) / dspan) * (W - PAD * 2);
  const y = (v) => PAD + (H - PAD * 2) * (1 - (v - lo) / span);

  const line = pts.map((p, i) => x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ");
  const area = PAD + "," + (H - PAD) + " " + line + " " + (W - PAD) + "," + (H - PAD);

  const first = pts[0], last = pts[pts.length - 1];
  const dir = last.v > first.v ? "up" : last.v < first.v ? "down" : "flat";

  const at = pts.map((p) => p.date).indexOf(markDate);
  const mark = at >= 0
    ? `<line class="mark" x1="${x(at).toFixed(1)}" y1="0" x2="${x(at).toFixed(1)}" y2="${H}"></line>`
    : "";

  const fmt = (n) => n.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
  const md = (d) => d.slice(5).replace("-", ".");
  /* 며칠에 걸친 몇 회차인지 같이 적는다. 값이 빠진 날이 있으면 둘이 어긋난다 */
  const days = dspan + 1;

  return `
    <div class="spark ${dir}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="${esc(label)} ${days}일 추이 — ${esc(fmt(first.v))}에서 ${esc(fmt(last.v))}">
        <polygon class="area" points="${area}"></polygon>
        ${mark}
        <polyline class="line" points="${line}"></polyline>
      </svg>
      <div class="spark-foot">
        <span>${esc(md(first.date))} ${esc(fmt(first.v))}</span>
        <span>${days}일 · ${pts.length}회차</span>
        <span>${esc(md(last.date))} ${esc(fmt(last.v))}</span>
      </div>
    </div>`;
}

function mktDir(m) {
  return m.dir === "up" ? "up" : m.dir === "down" ? "down" : "";
}

function mktValue(m) {
  return `${esc(m.value)}${m.unit ? `<span class="unit">${esc(m.unit)}</span>` : ""}`;
}

function renderMarket(spec, shown) {
  const el = $(spec.id);
  if (!el) return;

  const data = marketOf(shown, spec);
  if (!data.rows.length) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;

  const main = data.rows.filter((m) => spec.isMain(String(m.label || "")))[0];
  const rest = data.rows.filter((m) => m !== main);

  const mainBox = main ? `
    <div class="mkt-main">
      <span class="stat-label">${esc(main.label)}</span>
      <div class="big">
        <b>${mktValue(main)}</b>
        <span class="d ${mktDir(main)}">${esc(main.delta || "")}</span>
      </div>
      ${main.note && main.note !== data.asOf
        ? `<div class="mkt-note">${esc(main.note)}</div>` : ""}
      ${renderSpark(mktSeries(spec), shown ? shown.date : "", main.label)}
    </div>`
    : `<div class="mkt-empty">이 날은 대표 지표가 기록되지 않았습니다</div>`;

  const restBox = rest.length ? `
    <div class="mkt-rows">
      ${rest.map((m) => `
        <div class="mkt-row">
          <span class="n">${esc(m.label)}</span>
          <span class="v">${mktValue(m)}</span>
          <span class="d ${mktDir(m)}">${esc(m.delta || m.note || "")}</span>
        </div>`).join("")}
    </div>` : "";

  el.innerHTML = `
    <div class="mkt-head">
      <h2>${esc(spec.title)}</h2>
      <span class="asof">${esc(data.asOf || (shown ? shown.date : ""))}</span>
    </div>
    <div class="mkt-body">
      ${mainBox}
      ${restBox}
    </div>`;
}

function renderMarkets() {
  const shown = selectedDay() || BRIEFINGS[0];
  MARKETS.forEach((spec) => renderMarket(spec, shown));
}

function renderDates() {
  const chips = [`
    <button class="datechip all" type="button" data-date="${ALL}" aria-pressed="${activeDate === ALL}">
      <span class="d">전체</span>
      <span class="w">${BRIEFINGS.length}일 · ${countFor(ALL, activeTopic)}건</span>
    </button>`];

  /* 주간 회고가 하나라도 있을 때만 칩을 낸다 */
  if (typeof WEEKLIES !== "undefined" && WEEKLIES.length) {
    chips.push(`
      <button class="datechip all" type="button" data-date="${WEEK}" aria-pressed="${activeDate === WEEK}">
        <span class="d">주간</span>
        <span class="w">회고 ${WEEKLIES.length}건</span>
      </button>`);
  }

  BRIEFINGS.forEach((b) => {
    const [, m, d] = b.date.split("-");
    chips.push(`
      <button class="datechip" type="button" data-date="${esc(b.date)}" aria-pressed="${activeDate === b.date}">
        <span class="d">${m}.${d}</span>
        <span class="w">${esc(dayLabel(b).replace("요일", ""))} · ${countFor(b.date, activeTopic)}건</span>
      </button>`);
  });

  $("dates").innerHTML = chips.join("");
  $("dates").querySelectorAll(".datechip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeDate = btn.dataset.date;
      render();
    });
  });
}

function renderFilters() {
  /* 주간 회고는 주제로 갈라지지 않는다 */
  $("filters").hidden = activeDate === WEEK;
  if (activeDate === WEEK) { $("filters").innerHTML = ""; return; }

  const topics = [ALL, ...allTopics()];
  $("filters").innerHTML = topics.map((t) => `
    <button class="chip" type="button" data-topic="${esc(t)}" aria-pressed="${t === activeTopic}">
      ${esc(t)}<span class="count">${countFor(activeDate, t)}</span>
    </button>`).join("");

  $("filters").querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTopic = btn.dataset.topic;
      render();
    });
  });
}

function renderNote(note) {
  if (!note) return "";
  const body = note.items.length === 1
    ? `<div>${note.items[0]}</div>`
    : `<ul>${note.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
  return `<div class="note"><b>${esc(note.title)}</b>${body}</div>`;
}

function renderSources(sources) {
  return (sources || []).map((s) =>
    `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("");
}

function renderArc(arc) {
  return arc ? `<span class="arc">${esc(arc)}</span>` : "";
}

function renderItem(item) {
  return `
    <article class="item">
      <h4>${esc(item.title)}</h4>
      ${renderArc(item.arc)}
      <p>${esc(item.body)}</p>
      <div class="sources">${renderSources(item.sources)}</div>
    </article>`;
}

function renderBriefs(briefs) {
  if (!briefs || !briefs.length) return "";
  return `
    <div class="briefs-head">그 외 ${briefs.length}건</div>
    <div class="briefs">
      ${briefs.map((b) => `
        <div class="brief">
          <span>${esc(b.title)}</span>
          ${renderArc(b.arc)}
          ${renderSources(b.sources)}
        </div>`).join("")}
    </div>`;
}

function renderInsight(insight) {
  if (!insight || !insight.length) return "";
  const rows = insight
    .filter((x) => x && x.text)
    .map((x) => `<div><dt>${esc(x.label)}</dt><dd>${x.text}</dd></div>`)
    .join("");
  if (!rows) return "";
  return `
    <div class="insight">
      <div class="insight-head">
        <h3>그래서 뭐?</h3>
        <span class="caveat">사실이 아니라 판단입니다. 위 항목만 재료로 씁니다</span>
      </div>
      <dl>${rows}</dl>
    </div>`;
}

/* ── 흐름 온도계 ───────────────────────────────────────────
   ARCS는 tools/sync_arcs.py가 상태/추적.md에서 뽑아 넣는다. 여기서 하는 일은
   타임라인 날짜를 세는 것뿐이다 — 최근 7일에 몇 번 진전했나, 그 앞 7일과 비교해
   늘었나 줄었나, 마지막 진전이 며칠 전인가.

   **새 사실을 만들지 않는다.** 온도는 판단이 아니라 대장에 적힌 날짜의 집계다.
   그래서 "그래서 뭐?" 블록의 액센트 배경을 쓰지 않고, 액센트 농도로만 나타낸다.

   기준일은 뷰어의 시계가 아니라 **최신 브리핑 날짜**다. 페이지가 오래 방치돼도
   숫자가 저 혼자 식지 않게 하려는 것이다. */

const ARC_WINDOW = 7;      /* 최근 N일 */
const ARC_METER = 5;       /* 계기 칸 수 */

function arcAnchor() {
  return BRIEFINGS.length ? BRIEFINGS[0].date : TODAY;
}

function daysBetween(a, b) {
  return dayNum(b) - dayNum(a);
}

function arcHeat(arc, anchor) {
  let recent = 0, prior = 0;
  (arc.timeline || []).forEach((e) => {
    const gap = daysBetween(e.date, anchor);
    if (gap < 0) return;                       /* 기준일보다 미래면 세지 않는다 */
    if (gap < ARC_WINDOW) recent++;
    else if (gap < ARC_WINDOW * 2) prior++;
  });
  const since = arc.last ? daysBetween(arc.last, anchor) : null;

  let temp = "cold";
  if (recent >= 3) temp = "hot";
  else if (recent >= 1) temp = "warm";
  else if (prior >= 1) temp = "cooling";

  const trend = recent > prior ? "↑" : recent < prior ? "↓" : "→";
  return { recent: recent, prior: prior, since: since, temp: temp, trend: trend };
}

const ARC_ORDER = { hot: 0, warm: 1, cooling: 2, cold: 3 };

function arcRows() {
  const anchor = arcAnchor();
  return (typeof ARCS === "undefined" ? [] : ARCS)
    .filter((a) => a.status === "active")
    .map((a) => ({ arc: a, heat: arcHeat(a, anchor) }))
    .sort((x, y) =>
      (ARC_ORDER[x.heat.temp] - ARC_ORDER[y.heat.temp]) ||
      (y.heat.recent - x.heat.recent) ||
      (y.arc.count - x.arc.count));
}

function renderArcs() {
  const el = $("arcs");
  if (!el) return;

  const rows = arcRows();
  if (!rows.length) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;

  const anchor = arcAnchor();
  const moved = rows.filter((r) => r.heat.recent > 0).length;
  const md = (d) => d.slice(5).replace("-", ".");

  const body = rows.map((r) => {
    const a = r.arc, h = r.heat;
    const cells = [];
    for (let i = 0; i < ARC_METER; i++) {
      cells.push(`<i class="${i < Math.min(h.recent, ARC_METER) ? "on" : ""}"></i>`);
    }
    /* 타임라인은 최근 것부터 넉넉히 5줄까지. 대장은 오래된 것부터 적혀 있다 */
    const tl = (a.timeline || []).slice(-5).reverse();

    return `
      <details class="arc-row ${h.temp}">
        <summary>
          <span class="arc-meter" aria-hidden="true">${cells.join("")}</span>
          <span class="arc-name">${esc(a.name)}</span>
          <span class="arc-nums">
            <b>${h.recent}</b>${esc(h.trend)}<span class="sep">·</span>총 ${a.count}회<span class="sep">·</span>${
              h.since === null ? "—" : h.since === 0 ? "오늘" : h.since + "일 전"}
          </span>
        </summary>
        <dl class="arc-detail">
          <div><dt>지금</dt><dd>${esc(a.state)}</dd></div>
          ${a.next ? `<div><dt>다음 분기점</dt><dd>${esc(a.next)}</dd></div>` : ""}
          <div>
            <dt>타임라인 (최근 ${tl.length}줄 · 시작 ${esc(md(a.since))})</dt>
            <dd><ol>${tl.map((e) =>
              `<li><span>${esc(md(e.date))}</span>${esc(e.text)}</li>`).join("")}</ol></dd>
          </div>
        </dl>
      </details>`;
  }).join("");

  el.innerHTML = `
    <summary>
      <h2>진행 중인 흐름</h2>
      <span class="tally">${rows.length}개 · 최근 ${ARC_WINDOW}일 움직인 것 ${moved}개</span>
    </summary>
    <div class="arcs-body">
      <div class="arcs-caveat">
        추적 대장에 적힌 <b>진전 횟수를 센 것</b>입니다 — 판단이 아니라 집계입니다.
        계기는 최근 ${ARC_WINDOW}일 진전 수, 화살표는 그 앞 ${ARC_WINDOW}일과 비교한 것입니다.
        기준일은 최신 브리핑(${esc(md(anchor))})입니다.
      </div>
      ${body}
    </div>`;
}

/* ── 주간 회고 ─────────────────────────────────────────────
   날짜 메뉴의 "주간" 칩을 고르면 타임라인 자리에 뜬다. 일간과 달리
   새로 검색해 만든 것이 아니라, 그 주 브리핑과 추적 대장을 되짚은 것이다. */

function renderWeekly() {
  const list = (typeof WEEKLIES === "undefined" ? [] : WEEKLIES);
  if (!list.length) {
    return `<div class="empty">아직 주간 회고가 없습니다 — 월요일 아침에 만들어집니다</div>`;
  }
  const md = (d) => d.slice(5).replace("-", ".");

  return `<div class="weekly">${list.map((w) => `
    <section class="day">
      <div class="daymark">
        <span class="md">${esc(md(w.to))}</span>
        <span class="yr">${esc(w.to.slice(0, 4))}</span>
        <span class="wd">주간</span>
      </div>
      <div class="daybody">
        <div class="wk-head">
          <h2>${esc(w.label)}</h2>
          <span class="range">${esc(md(w.from))} — ${esc(md(w.to))} · ${esc(w.writtenAt)} 작성</span>
        </div>

        ${w.digest && w.digest.length ? `
          <div class="digest">
            <h3>이번 주 세 줄</h3>
            <ul>${w.digest.map((t) => `<li><span>${t}</span></li>`).join("")}</ul>
          </div>` : ""}

        ${renderInsight(w.insight)}

        ${w.arcs && w.arcs.length ? `
          <div class="wk-block">
            <h3>움직인 흐름</h3>
            <div class="wk-moved">
              ${w.arcs.map((a) => `
                <div>
                  <b>${esc(a.name)}</b>
                  <span class="p">이번 주 ${a.progress}회 · 누적 ${a.total}회</span>
                  <p>${esc(a.note)}</p>
                </div>`).join("")}
            </div>
          </div>` : ""}

        ${w.metrics && w.metrics.length ? `
          <div class="wk-block">
            <h3>주간 지표</h3>
            <div class="wk-metrics">
              ${w.metrics.map((m) => `
                <div>
                  <span class="l">${esc(m.label)}</span>
                  <span class="v">${esc(m.from)}<i>→</i>${esc(m.to)}</span>
                  <span class="d ${m.dir === "up" ? "up" : m.dir === "down" ? "down" : ""}">${esc(m.delta)}</span>
                </div>`).join("")}
            </div>
          </div>` : ""}

        ${(w.closed && w.closed.length) || (w.opened && w.opened.length) ? `
          <div class="wk-block">
            <h3>워치리스트</h3>
            <div class="wk-watch">
              ${w.closed && w.closed.length ? `
                <div>
                  <h4>닫힌 것 ${w.closed.length}건</h4>
                  <ul>${w.closed.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
                </div>` : ""}
              ${w.opened && w.opened.length ? `
                <div>
                  <h4>새로 연 것 ${w.opened.length}건</h4>
                  <ul>${w.opened.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
                </div>` : ""}
            </div>
          </div>` : ""}

        <div class="daymeta">${esc(w.note)}</div>
      </div>
    </section>`).join("")}</div>`;
}

function renderTimeline() {
  /* "주간"을 고르면 일간 대신 주간 회고를 보여준다 */
  if (activeDate === WEEK) {
    $("timeline").innerHTML = renderWeekly();
    return;
  }

  const days = BRIEFINGS.filter((b) => activeDate === ALL || b.date === activeDate).map((b) => {
    const sections = b.sections.filter((s) => activeTopic === ALL || s.topic === activeTopic);
    if (!sections.length) return "";

    const [y, m, d] = b.date.split("-");
    const showDigest = activeTopic === ALL && b.digest && b.digest.length;
    const showInsight = activeTopic === ALL;

    return `
      <section class="day">
        <div class="daymark">
          <span class="md">${m}.${d}</span>
          <span class="yr">${y}</span>
          <span class="wd">${esc(b.weekday)}요일</span>
          ${b.date === TODAY ? '<span class="badge-today">오늘</span>' : ""}
        </div>
        <div class="daybody">
          ${showDigest ? `
            <div class="digest">
              <h3>한눈에 보기</h3>
              <ul>${b.digest.map((t) => `<li><span>${t}</span></li>`).join("")}</ul>
            </div>` : ""}
          ${showInsight ? renderInsight(b.insight) : ""}
          ${sections.map((s) => `
            <div class="topic">
              <div class="topic-head">
                <h3>${esc(s.topic)}</h3>
                <span class="n">${sectionCount(s)}건</span>
              </div>
              ${(s.items || []).map(renderItem).join("")}
              ${renderBriefs(s.briefs)}
              ${renderNote(s.note)}
            </div>`).join("")}
          <div class="daymeta">
            수집 ${esc(b.collectedAt)} · ${esc(b.window)}${b.tally ? " · " + esc(b.tally) : ""}
          </div>
        </div>
      </section>`;
  }).join("");

  const none = activeDate === ALL
    ? "해당 주제의 브리핑이 없습니다"
    : `${activeDate}에는 '${activeTopic}' 항목이 없습니다`;
  $("timeline").innerHTML = days || `<div class="empty">${esc(none)}</div>`;
}

function renderFoot() {
  const oldest = BRIEFINGS[BRIEFINGS.length - 1];
  const latest = BRIEFINGS[0];
  const range = BRIEFINGS.length > 1 ? `${oldest.date} — ${latest.date}` : latest ? latest.date : "";
  $("foot").innerHTML =
    `<span class="byline">Artifact by DK</span>` +
    `News Brief · ${esc(range)} · ${BRIEFINGS.length}개 브리핑<br>` +
    `<code>/brief</code> 실행 시 갱신됩니다. 모든 항목은 원문 출처 링크를 답니다.`;
}

function render() {
  renderStrip();
  renderMarkets();
  renderArcs();
  renderDates();
  renderFilters();
  renderTimeline();
}

render();
renderFoot();
</script>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("themetoggle");
  if (!btn) return;

  // 저장된 선택이 없으면 data-theme을 비워 두고 prefers-color-scheme에 맡긴다.
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);

  function current() {
    var t = root.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function paint() {
    btn.textContent = current() === "dark" ? "LIGHT" : "DARK";
    btn.setAttribute("aria-label", "테마 전환");
  }

  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paint();
  });

  paint();
})();
</script>
